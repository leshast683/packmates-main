<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    /* App-only: neutralize this page's fadeUp entrance animations as early as
       possible (before the page's own CSS/DOM even parses), since combined
       with the native app's page-crossfade they read as a double "pop" —
       the page fades in via the transition, then its own cards visibly
       animate into place a second time on top of that. Website unaffected. */
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      document.write('<style>@keyframes fadeUp{0%,100%{opacity:1;transform:none}}</style>');
    }
    /* App-only: this page's own JS/data (async fetches, list rendering)
       takes a beat after the HTML itself loads, and since the native app
       has no crossfade to bridge that, it read as a blank/white flash
       between pages. Cover it with a small branded spinner shown from the
       very first instant, removed once window 'load' fires (with a safety
       timeout in case some resource never settles). Website unaffected. */
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      document.write(
        '<style>#pmLoadSpin{position:fixed;inset:0;z-index:99999;display:flex;' +
        'align-items:center;justify-content:center;background:#eef1f5;' +
        'transition:opacity .2s ease;}' +
        '#pmLoadSpin.pm-hide{opacity:0;pointer-events:none;}' +
        '#pmLoadSpin svg{width:30px;height:30px;animation:pmSpin .8s linear infinite;color:#5f9d30;}' +
        '@keyframes pmSpin{to{transform:rotate(360deg)}}</style>' +
        '<div id="pmLoadSpin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' +
        '<circle cx="12" cy="12" r="9" stroke-opacity="0.2"/><path d="M21 12a9 9 0 00-9-9"/></svg></div>'
      );
      var _pmHideSpin = function () {
        var el = document.getElementById('pmLoadSpin');
        if (!el) return;
        el.classList.add('pm-hide');
        setTimeout(function () { el.remove(); }, 250);
      };
      window.addEventListener('load', _pmHideSpin);
      setTimeout(_pmHideSpin, 2000);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    /* App-only: pinch/double-tap zoom reads as a bug in a native app
       (nothing here is meant to be zoomable), but disabling it on the
       public website would hurt pinch-zoom accessibility for browser
       visitors - so this only overrides the viewport inside Capacitor. */
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
    }
  </script>

  <title>New Trip — Packmates AI</title>
  <meta name="description" content="Plan a new trip with Packmates AI — dates, destinations, and your travel crew.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="New Trip — Packmates AI">
  <meta property="og:description" content="Plan a new trip with Packmates AI — dates, destinations, and your travel crew.">
  <meta property="og:image" content="https://packmatesai.com/img/discover-hero.jpg">
  <meta property="og:url" content="https://packmatesai.com/newTrip.html">
  <link rel="icon" type="image/png" href="img/appIcon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d3347">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <style>
    body > main {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════
       TWO-PANEL LAYOUT
    ══════════════════════════ */
    .nt-layout {
      display: grid;
      grid-template-columns: 1fr 560px;
      height: 100%;
      overflow: hidden;
    }

    /* ── Left: form panel ── */
    .nt-form-panel {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      background: var(--bg);
      padding: 32px 40px 40px;
    }

    .nt-form-panel::-webkit-scrollbar { width: 4px; }
    .nt-form-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* Page header */
    .nt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      animation: fadeUp 0.4s ease both;
    }

    .nt-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .nt-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
      height: 38px;
      background: var(--surface);
      color: var(--text-2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s;
    }
    .nt-back-btn:hover { background: var(--bg); border-color: var(--border-2, #c8d4db); }

    /* Section label */
    .nt-section {
      margin-bottom: 22px;
      animation: fadeUp 0.4s ease both;
      position: relative;
      z-index: 1;
    }

    /* Destination and Airline sections must sit above later sections so dropdowns overlay them */
    #newTripForm .nt-section:first-child  { z-index: 10; }
    #newTripForm .nt-section:nth-child(2) { z-index: 9; }
    #newTripForm .nt-section:nth-child(3) { z-index: 8; }

    .nt-section:nth-child(2)  { animation-delay: 0.04s; }
    .nt-section:nth-child(3)  { animation-delay: 0.07s; }
    .nt-section:nth-child(4)  { animation-delay: 0.10s; }
    .nt-section:nth-child(5)  { animation-delay: 0.13s; }
    .nt-section:nth-child(6)  { animation-delay: 0.16s; }
    .nt-section:nth-child(7)  { animation-delay: 0.19s; }

    .nt-label {
      display: block;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    /* Input with icon */
    .nt-input-wrap {
      position: relative;
    }

    .nt-input-wrap svg {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      stroke: var(--text-3);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
      pointer-events: none;
      flex-shrink: 0;
    }

    .nt-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: var(--text-1);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin: 0;
    }

    .nt-input::placeholder { color: var(--text-3); }

    .nt-input:focus {
      border-color: var(--teal-a);
      box-shadow: 0 0 0 3px rgba(12,122,122,0.12);
    }

    .nt-input.no-icon {
      padding-left: 16px;
    }

    /* Date row */
    .nt-dates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .nt-date-field { display: flex; flex-direction: column; gap: 8px; }

    .nt-date-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .nt-date-input {
      padding: 12px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.875rem;
      color: var(--text-1);
      outline: none;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin: 0;
    }

    .nt-date-input:focus {
      border-color: var(--teal-a);
      box-shadow: 0 0 0 3px rgba(12,122,122,0.12);
    }

    /* Traveler counter */
    .nt-counter {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      width: fit-content;
    }

    .nt-counter-btn {
      width: 44px; height: 44px;
      background: transparent;
      border: none;
      font-size: 1.2rem;
      font-weight: 300;
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s, color 0.18s;
      flex-shrink: 0;
    }
    .nt-counter-btn:hover { background: var(--bg); color: var(--text-1); }
    .nt-counter-btn:active { background: var(--border); }

    .nt-counter-val {
      min-width: 52px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-1);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 0 10px;
      line-height: 44px;
    }

    /* Activity chips */
    .nt-chips {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .activity-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 8px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      font-size: 0.72rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: var(--text-2);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
      white-space: nowrap;
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
    }
    .chip-icon {
      width: 40px; height: 40px;
      flex-shrink: 0;
      display: block;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12));
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
    }

    .activity-chip:hover:not(.selected) {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 8px 24px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06);
      border-color: var(--green);
      background: var(--bg);
      color: var(--text-1);
    }
    .activity-chip:hover:not(.selected) .chip-icon {
      transform: scale(1.12);
    }

    .activity-chip:active {
      transform: scale(0.96);
      transition-duration: 0.08s;
    }

    .activity-chip.selected {
      background: var(--green-bg, rgba(95,157,48,0.12));
      border-color: var(--green);
      color: var(--green-dark, #4d8225);
      box-shadow: 0 4px 16px rgba(95,157,48,0.18);
    }
    .activity-chip.selected .chip-icon {
      filter: drop-shadow(0 2px 6px rgba(95,157,48,0.30));
    }

    /* Notes textarea */
    .nt-textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.875rem;
      color: var(--text-1);
      outline: none;
      resize: none;
      height: 96px;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin: 0;
    }

    .nt-textarea::placeholder { color: var(--text-3); }

    .nt-textarea:focus {
      border-color: var(--teal-a);
      box-shadow: 0 0 0 3px rgba(12,122,122,0.12);
    }

    /* Action row */
    .nt-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      animation: fadeUp 0.4s 0.22s ease both;
    }

    .nt-cancel-btn {
      padding: 0 24px;
      height: 44px;
      background: transparent;
      color: var(--text-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .nt-cancel-btn:hover { background: var(--bg); border-color: var(--border-2, #c8d4db); }

    .nt-save-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 28px;
      height: 44px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .nt-save-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .nt-save-btn:hover::before { opacity: 1; }
    .nt-save-btn:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(95,157,48,0.45);
    }
    .nt-save-btn:disabled {
      background: var(--border);
      color: var(--text-3);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── Right: preview panel ── */
    .nt-preview-panel {
      background: var(--navy-deep);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      /* Leaflet measures #ntMap's box on construction, before its
         invalidateSize() calls (below, in the init script) correct it —
         on a fresh page load that first measurement can land mid-layout
         and come out oversized, briefly showing an unstyled full-screen
         map. Stay invisible until JS confirms the size is right, then
         fade in; nothing else lives in this panel, so hiding it hides
         nothing else. */
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .nt-preview-panel.nt-map-ready { opacity: 1; }

    .nt-preview-bg {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      transition: background-image 0.6s ease;
    }


    .nt-preview-body {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      padding: 32px;
    }

    .nt-preview-eyebrow {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(95,157,48,0.9);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nt-preview-eyebrow::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
    }

    .nt-preview-dest {
      font-family: 'Blauer Nue', sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 8px;
      transition: all 0.3s;
    }

    .nt-preview-dest.placeholder {
      color: rgba(255,255,255,0.2);
      font-style: italic;
    }

    .nt-preview-dates {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
      margin-bottom: 16px;
      letter-spacing: 0.04em;
    }

    .nt-preview-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
      min-height: 28px;
    }

    .nt-preview-chip {
      padding: 4px 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.04em;
    }

    .nt-preview-travelers {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .nt-preview-travelers svg {
      width: 14px; height: 14px;
      stroke: rgba(255,255,255,0.35);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .nt-preview-hint {
      margin-top: 20px;
      background: rgba(95,157,48,0.12);
      border: 1px solid rgba(95,157,48,0.2);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.55;
    }

    .nt-preview-hint strong {
      color: rgba(95,157,48,0.9);
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Weather tags ── */
    .nt-preview-weather { margin-bottom: 14px; min-height: 20px; }

    .nt-weather-loading {
      font-size: 0.63rem;
      color: rgba(255,255,255,0.3);
      font-weight: 500;
      letter-spacing: 0.06em;
      animation: weatherPulse 1.4s ease-in-out infinite;
    }
    @keyframes weatherPulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    /* ── Airline picker ── */
    .nt-airline-wrap { position: relative; }

    .nt-airline-dd {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: var(--surface, #fff);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.07);
      z-index: 490;
      overflow: hidden;
      max-height: 240px;
      overflow-y: auto;
    }

    .nt-airline-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.12s;
      border-bottom: 1px solid var(--border);
    }
    .nt-airline-item:last-child { border-bottom: none; }
    .nt-airline-item:hover, .nt-airline-item.focused { background: var(--bg); }

    .nt-airline-iata {
      width: 40px; height: 30px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 800; letter-spacing: 0.05em;
      color: var(--teal-a, #0c7a7a);
      flex-shrink: 0;
      overflow: hidden;
    }

    .nt-airline-iata img {
      width: 100%; height: 100%;
      object-fit: contain;
      padding: 3px;
    }

    .nt-airline-iata-fb { /* shown when img fails */ }

    .nt-airline-name { font-size: 0.84rem; font-weight: 600; color: var(--text-1); }

    .nt-airline-rules {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .nt-airline-pill {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--text-3);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
    }

    .nt-airline-selected {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: var(--teal-a-bg, rgba(12,122,122,0.07));
      border: 1.5px solid var(--teal-a, #0c7a7a);
      border-radius: 12px;
      margin-top: 8px;
    }
    .nt-airline-selected.visible { display: flex; }
    .nt-airline-selected-logo {
      width: 52px; height: 36px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .nt-airline-selected-logo img {
      width: 100%; height: 100%;
      object-fit: contain;
      padding: 4px;
    }
    .nt-airline-selected-name { font-size: 0.84rem; font-weight: 700; color: var(--teal-a, #0c7a7a); flex: 1; }
    .nt-airline-selected-rules { font-size: 0.7rem; color: var(--text-3); }
    .nt-airline-clear { background: none; border: none; cursor: pointer; color: var(--text-3); font-size: 1rem; padding: 0 2px; line-height: 1; }
    .nt-airline-clear:hover { color: #c0392b; }

    /* ── Destination autocomplete ── */
    .nt-autocomplete {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: var(--surface, #fff);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.07);
      z-index: 500;
      overflow: hidden;
      animation: fadeUp 0.15s ease both;
    }

    .nt-ac-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.12s;
      border-bottom: 1px solid var(--border);
    }
    .nt-ac-item:last-child { border-bottom: none; }
    .nt-ac-item:hover, .nt-ac-item.focused { background: var(--bg); }

    .nt-ac-pin {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--teal-a-bg, rgba(12,122,122,0.10));
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .nt-ac-pin svg { width:13px;height:13px;stroke:var(--teal-a,#0c7a7a);fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2; }

    .nt-ac-main { font-size: 0.84rem; font-weight: 600; color: var(--text-1); }
    .nt-ac-sub  { font-size: 0.7rem; color: var(--text-3); font-weight: 500; margin-top: 1px; }

    .nt-weather-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .wt-warm { background: rgba(251,191,36,0.18); color: #fcd34d; border: 1px solid rgba(251,191,36,0.25); }
    .wt-cold { background: rgba(96,165,250,0.15); color: #93c5fd; border: 1px solid rgba(96,165,250,0.25); }
    .wt-rain { background: rgba(99,102,241,0.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.2); }
    .wt-snow { background: rgba(226,232,240,0.12); color: #e2e8f0; border: 1px solid rgba(226,232,240,0.18); }
    .wt-wind { background: rgba(156,163,175,0.1); color: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.1); }

    /* ── MAP PANEL ── */
    #ntMap {
      position: absolute; inset: 0; z-index: 0;
    }
    /* Keep Leaflet controls above gradient overlay */
    .nt-preview-panel .leaflet-pane   { z-index: 1; }
    .nt-preview-panel .leaflet-top,
    .nt-preview-panel .leaflet-bottom { z-index: 5; }
    .nt-preview-overlay               { z-index: 6; }
    .nt-preview-body                  { z-index: 8; }

    /* Styled zoom control */
    .leaflet-control-zoom a {
      background: #fff !important;
      color: var(--text-2) !important;
      border-color: var(--border) !important;
      font-size: 16px !important;
      line-height: 28px !important;
      width: 28px !important; height: 28px !important;
    }
    .leaflet-control-zoom a:hover {
      background: var(--teal-a-bg) !important;
      color: var(--teal-a) !important;
    }
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12) !important;
    }
    .leaflet-control-attribution {
      background: rgba(255,255,255,0.7) !important;
      color: rgba(0,0,0,0.4) !important;
      font-size: 9px !important;
      backdrop-filter: blur(4px);
    }
    .leaflet-control-attribution a { color: rgba(0,0,0,0.5) !important; }

    /* Pulsing destination marker */
    .nt-map-marker-wrap { background: transparent; border: none; }
    .nt-map-marker-dot {
      width: 14px; height: 14px;
      background: #0c7a7a;
      border: 2.5px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      animation: mapDotPulse 2.2s ease-in-out infinite;
    }
    @keyframes mapDotPulse {
      0%   { box-shadow: 0 0 0 0 rgba(12,122,122,0.55), 0 2px 8px rgba(0,0,0,0.4); }
      70%  { box-shadow: 0 0 0 14px rgba(12,122,122,0), 0 2px 8px rgba(0,0,0,0.4); }
      100% { box-shadow: 0 0 0 0 rgba(12,122,122,0), 0 2px 8px rgba(0,0,0,0.4); }
    }
    /* Tablet: form panel narrow due to preview panel sharing space */
    @media (max-width: 1000px) and (min-width: 641px) {
      .nt-chips { grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .chip-icon { width: 32px; height: 32px; }
      .activity-chip { padding: 12px 6px 10px; font-size: 0.65rem; border-radius: 12px; }
    }

    @media (max-width: 640px) {
      body > main { overflow-y: auto; height: 100vh; }
      .nt-layout { grid-template-columns: 1fr; height: auto; overflow: visible; }
      /* Map used to be hidden entirely on mobile — now shown above the
         form instead (order:-1 moves it first visually without changing
         DOM order), with an explicit height since #ntMap fills its
         parent via position:absolute and has nothing to size against
         once the desktop two-column layout collapses. */
      .nt-preview-panel { display: block; order: -1; height: 200px; position: relative; }
      .nt-form-panel { padding: 20px 16px 125px; height: auto; overflow: visible; order: 0; }
      .nt-header { flex-direction: row; align-items: center; margin-bottom: 20px; }
      .nt-header h1 { font-size: 1.2rem; }
      .nt-dates { flex-direction: column; gap: 12px; }
      .nt-date-field { width: 100%; }
      .nt-save-btn { width: 100%; }
      .nt-section { margin-bottom: 18px; }
      .nt-chips-wrap { gap: 8px; }
      /* Mobile: 5 cols × 3 rows, taller cards so label fits */
      .nt-chips { grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .chip-icon { width: 26px; height: 26px; }
      .activity-chip {
        aspect-ratio: unset;
        padding: 12px 4px 10px;
        font-size: 0.58rem;
        border-radius: 11px;
        white-space: normal;
        word-break: break-word;
        min-height: 72px;
      }
    }

    @media (max-width: 380px) {
      .nt-chips { grid-template-columns: repeat(4, 1fr); gap: 5px; }
      .chip-icon { width: 22px; height: 22px; }
      .activity-chip { padding: 10px 3px 8px; font-size: 0.54rem; min-height: 64px; }
    }

    /* ── Flatpickr dark theme ── */
    .flatpickr-calendar {
      background: #0d1e2d !important;
      border: 1.5px solid rgba(78,206,206,0.18) !important;
      border-radius: 18px !important;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.3) !important;
      font-family: 'Montserrat', sans-serif !important;
      padding: 6px !important;
    }
    .flatpickr-calendar.arrowTop::before,
    .flatpickr-calendar.arrowTop::after { border-bottom-color: #0d1e2d !important; }
    .flatpickr-months { padding: 4px 0 2px !important; }
    .flatpickr-month { background: transparent !important; color: #fff !important; height: 38px !important; }
    .flatpickr-current-month {
      font-size: 0.9rem !important; font-weight: 700 !important; color: #fff !important;
      padding-top: 6px !important;
    }
    .flatpickr-current-month .flatpickr-monthDropdown-months {
      background: #0d1e2d !important; color: #fff !important; font-weight: 700 !important;
      border: none !important; outline: none !important;
    }
    .flatpickr-current-month input.cur-year {
      color: #fff !important; font-weight: 700 !important;
    }
    .numInputWrapper:hover { background: rgba(255,255,255,0.06) !important; }
    .numInput { color: #fff !important; }
    .arrowUp::after { border-bottom-color: rgba(255,255,255,0.5) !important; }
    .arrowDown::after { border-top-color: rgba(255,255,255,0.5) !important; }
    .flatpickr-prev-month, .flatpickr-next-month {
      color: rgba(255,255,255,0.6) !important; fill: rgba(255,255,255,0.6) !important;
      padding: 8px 10px !important;
    }
    .flatpickr-prev-month:hover, .flatpickr-next-month:hover,
    .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg {
      color: #4ecece !important; fill: #4ecece !important;
    }
    .flatpickr-weekdays { background: transparent !important; margin-top: 4px !important; }
    .flatpickr-weekday {
      background: transparent !important; color: rgba(78,206,206,0.7) !important;
      font-size: 0.65rem !important; font-weight: 800 !important; letter-spacing: 0.06em !important;
    }
    .flatpickr-days { border-top: 1px solid rgba(255,255,255,0.06) !important; }
    .dayContainer { padding: 4px 0 !important; }
    .flatpickr-day {
      color: rgba(255,255,255,0.78) !important; border-radius: 10px !important;
      border-color: transparent !important; font-size: 0.82rem !important; font-weight: 500 !important;
    }
    .flatpickr-day:hover:not(.selected):not(.today):not(.startRange):not(.endRange) {
      background: rgba(255,255,255,0.08) !important; border-color: transparent !important;
      color: #fff !important;
    }
    .flatpickr-day.today {
      border-color: rgba(78,206,206,0.5) !important; color: #4ecece !important; font-weight: 700 !important;
    }
    .flatpickr-day.today:hover { background: rgba(78,206,206,0.12) !important; }
    .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange {
      background: #0c7a7a !important; border-color: #0c7a7a !important;
      color: #fff !important; font-weight: 700 !important;
    }
    .flatpickr-day.selected:hover { background: #0a6868 !important; }
    .flatpickr-day.flatpickr-disabled, .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay {
      color: rgba(255,255,255,0.2) !important;
    }
    /* Mobile calendar responsiveness */
    @media (max-width: 640px) {
      .flatpickr-calendar {
        width: 92vw !important;
        max-width: 340px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
      }
      .flatpickr-day { height: 38px !important; line-height: 38px !important; font-size: 0.85rem !important; }
      .dayContainer { width: 100% !important; min-width: unset !important; max-width: unset !important; }
      .flatpickr-days, .flatpickr-innerContainer { width: 100% !important; }
    }

    /* Style the alt input like our existing date field */
    .flatpickr-input.flatpickr-mobile,
    input.flatpickr-input[readonly] {
      padding: 12px 16px !important;
      background: var(--surface) !important;
      border: 1.5px solid var(--border) !important;
      border-radius: 12px !important;
      font-family: 'Montserrat', sans-serif !important;
      font-size: 0.875rem !important;
      color: var(--text-1) !important;
      width: 100% !important;
      cursor: pointer !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }
    input.flatpickr-input[readonly]:focus,
    input.flatpickr-input[readonly].active {
      border-color: var(--teal-a) !important;
      box-shadow: 0 0 0 3px rgba(12,122,122,0.12) !important;
      outline: none !important;
    }
  </style>
</head>
<body>

  <!-- ══ SIDEBAR ══ -->
  <nav class="sidebar" data-page="newTrip.html"></nav>
  <script src="nav.js"></script>

  <!-- ══ MAIN ══ -->
  <main>
    <div class="nt-layout">

      <!-- ── Form panel ── -->
      <div class="nt-form-panel">

        <div class="nt-header">
          <div>
            <h1>Plan a New Trip</h1>
            <div style="font-size:0.75rem;color:var(--text-3);margin-top:3px;font-weight:500;">Fill in the details and get a smart packing list</div>

          <a href="index.html" class="nt-back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>

          </a>
        </div>

        <form id="newTripForm">

          <!-- Trip Name (optional) -->
          <div class="nt-section">
            <label class="nt-label" for="tripName">Trip Name <span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-3);">(optional)</span></label>
            <div class="nt-input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
              <input class="nt-input" id="tripName" type="text" placeholder="e.g. Sarah's Bachelorette Trip" autocomplete="off">
            </div>
          </div>

          <!-- Destination -->
          <div class="nt-section">
            <label class="nt-label" for="tripDestination">Destination</label>
            <div class="nt-input-wrap" style="position:relative">
              <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <input class="nt-input" id="tripDestination" type="text" placeholder="Where are you going?" autocomplete="off">
              <div class="nt-autocomplete" id="destDropdown" style="display:none"></div>
            </div>
          </div>

          <!-- Airline -->
          <div class="nt-section">
            <label class="nt-label" for="airlineInput">Airline</label>
            <div class="nt-airline-wrap">
              <div class="nt-input-wrap">
                <svg viewBox="0 0 24 24"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21 4 19.5 2.5S18 2 16.5 3.5L13 7 4.8 5.2l-2.3 2.3 6.1 3.5-1.9 1.9-2.1-.4-1.4 1.4 2.5 1.5 1.5 2.5 1.4-1.4-.4-2.1 1.9-1.9z"/></svg>
                <input class="nt-input" id="airlineInput" type="text" placeholder="Search airline…" autocomplete="off">
                <div class="nt-airline-dd" id="airlineDd" style="display:none"></div>
              </div>
              <div class="nt-airline-selected" id="airlineSelected">
                <div class="nt-airline-selected-logo" id="airlineLogoBox">
                  <img id="airlineLogoImg" src="" alt="" loading="lazy">
                </div>
                <div>
                  <div class="nt-airline-selected-name" id="airlineSelName">—</div>
                  <div class="nt-airline-selected-rules" id="airlineSelRules">—</div>
                </div>
                <button class="nt-airline-clear" id="airlineClearBtn" type="button" title="Clear">✕</button>
              </div>
            </div>
          </div>

          <!-- Dates -->
          <div class="nt-section">
            <div class="nt-dates">
              <div class="nt-date-field">

              <button type="button" class="activity-chip" data-category="Hiking">
                <svg class="chip-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><image href="img/activity_hiking.png" x="0" y="0" width="40" height="40"/></svg>
                Hiking

              <button type="button" class="activity-chip" data-category="Camping">
                <svg class="chip-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><image href="img/activity_camping.png" x="0" y="0" width="40" height="40"/></svg>
                Camping
              </button>
              <button type="button" class="activity-chip" data-category="Swimming">
                <svg class="chip-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><image href="img/activity_swimming.png" x="0" y="0" width="40" height="40"/></svg>
                Swimming
              </button>
              <button type="button" class="activity-chip" data-category="Snow Sports">
                <svg class="chip-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><image href="img/activity_snowsports.png" x="0" y="0" width="40" height="40"/></svg>
                Snow Sports
              </button>
              <button type="button" class="activity-chip" data-category="Gym">
                <svg class="chip-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><image href="img/activity_gym.png" x="0" y="0" width="40" height="40"/></svg>
                Gym
              </button>
              <button type="button" class="activity-chip" data-category="Business Trip">
                <svg class="chip-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><image href="img/activity_business.png" x="0" y="0" width="40" height="40"/></svg>
                Business
              </button>
              <button type="button" class="activity-chip" data-category="Night Out">
                <svg class="chip-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><image href="img/activity_nightout.png" x="0" y="0" width="40" height="40"/></svg>

              </button>
              <button type="button" class="activity-chip" data-category="Baby">

              <button type="button" class="activity-chip" data-category="Theme Park">

        <div style="display:none">

  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script src="lib/sync-guard.js"></script>
  <script src="auth.js"></script>
  <script src="notifications.js"></script>
  <script src="airlines.js"></script>
  <script>
    Auth.requireAuth('welcome.html');

    /* ── Leaflet map ── */
    const ntMap = L.map('ntMap', {
      center: [20, 10], zoom: 2,
      zoomControl: false,
      attributionControl: true,
      scrollWheelZoom: false,
    });
    L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
    }).addTo(ntMap);
    L.control.zoom({ position: 'bottomright' }).addTo(ntMap);
    /* Ensure tiles render once layout is stable */
    requestAnimationFrame(() => {
      ntMap.invalidateSize();
      document.querySelector('.nt-preview-panel').classList.add('nt-map-ready');
    });
    setTimeout(() => ntMap.invalidateSize(), 350);

    let destMarker = null;

    function flyToDestination(lat, lon) {
      if (destMarker) { ntMap.removeLayer(destMarker); destMarker = null; }
      ntMap.flyTo([lat, lon], 10, { duration: 1.4, easeLinearity: 0.5 });
      const icon = L.divIcon({
        className: 'nt-map-marker-wrap',
        html: '<div class="nt-map-marker-dot"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7],
      });
      destMarker = L.marker([lat, lon], { icon }).addTo(ntMap);
    }

    /* ── City image ── */
    async function fetchCityImage(city) {
      try {
        const res = await fetch(
          `/api/pexels?query=${encodeURIComponent(city)}+city+travel&orientation=landscape&per_page=10`,
          { headers: { Authorization: `Bearer ${await Auth.getTokenAsync()}` } }
        );
        const data = await res.json();
        const photos = data.photos || [];
        if (!photos.length) return null;
        const best = photos.reduce((a, b) => a.width * a.height >= b.width * b.height ? a : b);
        return best.src.large2x || best.src.original || null;
      } catch { return null; }
    }

    /* ── Destination autocomplete ── */
    let acDebounce;
    let focusedIdx = -1;
    /* Set on selection from the geocoding dropdown below (the only place
       a destination's country is ever known) — read at trip-save time so
       buildTripProfile() (lib/packing-items.js) can suggest Passport only
       for international trips. Left null if the user types a destination
       without picking a suggestion; treated as "unknown, assume
       international" downstream rather than silently dropping Passport. */
    let selectedDestinationCountry = null;

    async function fetchSuggestions(query) {
      try {
        const res  = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=12&language=en&format=json`);
        const data = await res.json();
        const all  = data.results || [];
        /* keep only populated places — drop countries, admin regions, continents */
        return all
          .filter(r => {
            const fc = r.feature_code || '';
            return fc.startsWith('PPL') || fc.startsWith('PPLA') || fc === 'PPLC';
          })
          .slice(0, 6);
      } catch { return []; }
    }

    function showDropdown(results) {
      const dd = document.getElementById('destDropdown');
      if (!results.length) { dd.style.display = 'none'; return; }
      focusedIdx = -1;
      dd.innerHTML = results.map((r, i) => {
        const sub = [r.admin1, r.country].filter(Boolean).join(', ');
        return `<div class="nt-ac-item" data-idx="${i}" data-name="${r.name}" data-sub="${sub}" data-lat="${r.latitude}" data-lon="${r.longitude}" data-country="${r.country || ''}"
                  onmousedown="selectSuggestion(event,this)">
          <div class="nt-ac-pin"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
          <div><div class="nt-ac-main">${r.name}</div>${sub ? `<div class="nt-ac-sub">${sub}</div>` : ''}</div>
        </div>`;
      }).join('');
      dd.style.display = '';
    }

    function hideDropdown() {
      document.getElementById('destDropdown').style.display = 'none';
      focusedIdx = -1;
    }

    function selectSuggestion(e, el) {
      e.preventDefault();
      const name = el.dataset.name;
      document.getElementById('tripDestination').value = name;
      selectedDestinationCountry = el.dataset.country || null;
      hideDropdown();
      updatePreview();
      scheduleWeatherFetch();
      const lat = parseFloat(el.dataset.lat);
      const lon = parseFloat(el.dataset.lon);
      if (!isNaN(lat) && !isNaN(lon)) flyToDestination(lat, lon);
    }
    window.selectSuggestion = selectSuggestion;

    /* Keyboard navigation for dropdown */
    document.addEventListener('keydown', e => {
      const dd = document.getElementById('destDropdown');
      if (dd.style.display === 'none') return;
      const items = dd.querySelectorAll('.nt-ac-item');
      if (!items.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        focusedIdx = Math.min(focusedIdx + 1, items.length - 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        focusedIdx = Math.max(focusedIdx - 1, 0);
      } else if (e.key === 'Enter' && focusedIdx >= 0) {
        e.preventDefault();
        items[focusedIdx].dispatchEvent(new MouseEvent('mousedown', {bubbles:true}));
        return;
      } else if (e.key === 'Escape') {
        hideDropdown(); return;
      } else { return; }
      items.forEach((el, i) => el.classList.toggle('focused', i === focusedIdx));
    });

    /* ── Weather: Open-Meteo geocode + forecast/historical ── */
    /* ── Airline picker ── */
    let selectedAirline = null;

    function airlineRulesText(a) {
      return `Carry-on: ${a.carry.dims}${a.carry.weight !== 'No limit' ? ' · ' + a.carry.weight : ''} · Checked: ${a.checked.weight} · ${a.checked.fee}`;
    }

    function renderAirlineDd(query) {
      const dd = document.getElementById('airlineDd');
      const q  = query.toLowerCase();
      const matches = PACKMATES_AIRLINES.filter(a =>
        a.name.toLowerCase().includes(q) || a.iata.toLowerCase().includes(q)
      ).slice(0, 8);

      if (!matches.length) { dd.style.display = 'none'; return; }

      dd.innerHTML = matches.map(a => `
        <div class="nt-airline-item" onmousedown="selectAirline('${a.iata}')">
          <div class="nt-airline-iata">
            <img src="https://www.gstatic.com/flights/airline_logos/70px/${a.iata}.png"
                 alt="${a.iata}"
                 loading="lazy"
                 onerror="this.style.display='none';this.nextSibling.style.display='block'">
            <span class="nt-airline-iata-fb" style="display:none">${a.iata}</span>
          </div>
          <div>
            <div class="nt-airline-name">${a.name}</div>
            <div class="nt-airline-rules">
              <span class="nt-airline-pill">Carry-on ${a.carry.dims}</span>
              <span class="nt-airline-pill">Checked ${a.checked.weight}</span>
              <span class="nt-airline-pill">${a.checked.fee}</span>
            </div>
          </div>
        </div>`).join('');
      dd.style.display = '';
    }

    function selectAirline(iata) {
      selectedAirline = PACKMATES_AIRLINES.find(a => a.iata === iata);
      if (!selectedAirline) return;
      document.getElementById('airlineInput').value = selectedAirline.name;
      document.getElementById('airlineDd').style.display = 'none';

      const img = document.getElementById('airlineLogoImg');
      img.alt = selectedAirline.iata;
      img.src = `https://www.gstatic.com/flights/airline_logos/70px/${selectedAirline.iata}.png`;
      img.style.display = '';
      img.onerror = function() {
        this.style.display = 'none';
        document.getElementById('airlineLogoBox').textContent = selectedAirline.iata;
        document.getElementById('airlineLogoBox').style.cssText += ';font-size:0.6rem;font-weight:800;color:var(--teal-a)';
      };

      document.getElementById('airlineSelName').textContent  = selectedAirline.name;
      document.getElementById('airlineSelRules').textContent = airlineRulesText(selectedAirline);
      document.getElementById('airlineSelected').classList.add('visible');
    }
    window.selectAirline = selectAirline;

    document.getElementById('airlineInput').addEventListener('input', e => {
      const q = e.target.value.trim();
      if (!q) { document.getElementById('airlineDd').style.display = 'none'; return; }
      renderAirlineDd(q);
    });

    document.getElementById('airlineInput').addEventListener('focus', e => {
      const q = e.target.value.trim();
      if (q) renderAirlineDd(q);
      else renderAirlineDd('');
    });

    document.getElementById('airlineInput').addEventListener('blur', () => {
      setTimeout(() => { document.getElementById('airlineDd').style.display = 'none'; }, 160);
    });

    document.getElementById('airlineClearBtn').addEventListener('click', () => {
      selectedAirline = null;
      document.getElementById('airlineInput').value = '';
      document.getElementById('airlineSelected').classList.remove('visible');
    });

    async function geocodeLookup(city) {
      try {
        const res  = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        const data = await res.json();
        return data.results?.[0] || null;
      } catch { return null; }
    }

    async function fetchWeatherData(lat, lon, startDate, endDate) {
      try {
        const tripStart = new Date(startDate);
        const cutoff    = new Date(); cutoff.setDate(cutoff.getDate() + 15);
        let url;
        if (tripStart <= cutoff) {
          url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,precipitation,rain,snowfall,wind_speed_10m&start_date=${startDate}&end_date=${endDate}`;
        } else {
          const s = new Date(startDate), e = new Date(endDate);
          const dur = Math.round((e - s) / 86400000);
          const hE = new Date(e); hE.setFullYear(hE.getFullYear() - 1);
          const hS = new Date(hE); hS.setDate(hS.getDate() - dur);
          const fmt = d => d.toISOString().split('T')[0];
          url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,rain,snowfall,wind_speed_10m&start_date=${fmt(hS)}&end_date=${fmt(hE)}`;
        }
        const res  = await fetch(url);
        const data = await res.json();
        const h    = data.hourly;
        if (!h) return null;
        const nn = arr => (arr||[]).filter(v => v !== null);
        const temps = nn(h.temperature_2m), winds = nn(h.wind_speed_10m);
        const rain  = nn(h.rain), snow = nn(h.snowfall), prob = nn(h.precipitation_probability);
        return {
          tempMax:       temps.length ? Math.max(...temps) : null,
          tempMin:       temps.length ? Math.min(...temps) : null,
          windMax:       winds.length ? Math.max(...winds) : null,
          totalRainMm:   rain.reduce((a,b) => a+b, 0),
          totalSnowCm:   snow.reduce((a,b) => a+b, 0),
          avgPrecipProb: prob.length ? prob.reduce((a,b) => a+b, 0) / prob.length : null,
        };
      } catch { return null; }
    }

    function weatherToTags(w) {
      const tags = [];
      if (w.tempMax !== null && w.tempMax > 28) tags.push('warm');
      if ((w.tempMin !== null && w.tempMin < 10) || w.totalSnowCm > 0) tags.push('cold');
      if (w.totalRainMm > 0.5 || (w.avgPrecipProb !== null && w.avgPrecipProb > 50)) tags.push('rain');
      if (w.totalSnowCm > 0.25) tags.push('snow');
      if (w.windMax !== null && w.windMax >= 38) tags.push('wind');
      return tags;
    }

    const TAG_META = {
      warm: { label: '🌡️ Warm',  cls: 'wt-warm' },
      cold: { label: '🧊 Cold',  cls: 'wt-cold' },
      rain: { label: '🌧️ Rain',  cls: 'wt-rain' },
      snow: { label: '❄️ Snow',  cls: 'wt-snow' },
      wind: { label: '💨 Windy', cls: 'wt-wind' },
    };

    let weatherTags = [];
    let weatherDebounce;

    async function fetchAndShowWeather() {
      const dest = document.getElementById('tripDestination').value.trim();
      const from = document.getElementById('tripFromDate').value;
      const to   = document.getElementById('tripToDate').value;
      if (!dest || !from || !to) return;

      document.getElementById('weatherLoading').style.display = '';
      document.getElementById('weatherTagsEl').innerHTML = '';
      weatherTags = [];

      const place = await geocodeLookup(dest);
      if (!place) { document.getElementById('weatherLoading').style.display = 'none'; return; }

      const w = await fetchWeatherData(place.latitude, place.longitude, from, to);
      document.getElementById('weatherLoading').style.display = 'none';
      if (!w) return;

      weatherTags = weatherToTags(w);
      document.getElementById('weatherTagsEl').innerHTML = weatherTags
        .map(t => `<span class="nt-weather-tag ${TAG_META[t].cls}">${TAG_META[t].label}</span>`)
        .join('');
    }

    function scheduleWeatherFetch() {
      clearTimeout(weatherDebounce);
      weatherDebounce = setTimeout(fetchAndShowWeather, 900);
    }

    /* ── Invite code generator ── */
    function generateInviteCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const seg   = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
      return `${seg()}-${seg()}`;
    }

    /* ── Notifications helper ── */
    function pushNotification(type, text, tripName) {
      if (window.Notify) {
        Notify.push(type, text, tripName, null);
        Notify.showToast(text, type, tripName);
        Notify.updateBell();
      }
    }

    /* ── Pre-fill from explore ── */
    const exploreDest = localStorage.getItem('exploreDestination');
    if (exploreDest) {
      document.getElementById('tripDestination').value = exploreDest;
      localStorage.removeItem('exploreDestination');
      updatePreview();
      scheduleWeatherFetch();
      geocodeLookup(exploreDest).then(place => {
        if (place) flyToDestination(place.latitude, place.longitude);
      });
    }

    /* ── Traveler counter ── */
    let travelers = 1;
    function setTravelers(n) {
      travelers = Math.max(1, Math.min(20, n));
      document.getElementById('tripTravelers').value = travelers;
      document.getElementById('travelersDisplay').textContent = travelers;
      document.getElementById('previewTravelers').innerHTML = `
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        ${travelers} traveler${travelers !== 1 ? 's' : ''}`;
    }
    document.getElementById('incTravelers').addEventListener('click', () => setTravelers(travelers + 1));
    document.getElementById('decTravelers').addEventListener('click', () => setTravelers(travelers - 1));

    /* ── Activity chips ── */
    document.querySelectorAll('.activity-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        chip.classList.toggle('selected');
        updatePreview();
      });
    });

    /* ── Live preview update ── */
    let imageDebounce;

    function updatePreview() {
      const dest     = document.getElementById('tripDestination').value.trim();
      const fromDate = document.getElementById('tripFromDate').value;
      const toDate   = document.getElementById('tripToDate').value;

      const destEl = document.getElementById('previewDest');
      if (dest) {
        destEl.textContent = dest;
        destEl.classList.remove('placeholder');
      } else {
        destEl.textContent = 'Your destination';
        destEl.classList.add('placeholder');
      }

      if (fromDate || toDate) {
        const fmt = d => { if (!d) return '—'; const [y,m,day] = d.split('-'); return `${+m}/${+day}/${y}`; };
        document.getElementById('previewDates').textContent = `${fmt(fromDate)} — ${fmt(toDate)}`;
      } else {
        document.getElementById('previewDates').textContent = 'Set your travel dates';
      }

      const selected = Array.from(document.querySelectorAll('.activity-chip.selected'));
      document.getElementById('previewChips').innerHTML = selected
        .map(c => `<span class="nt-preview-chip">${c.textContent}</span>`)
        .join('');
    }

    /* Debounce image fetch + autocomplete on destination input */
    document.getElementById('tripDestination').addEventListener('input', () => {
      updatePreview();
      const dest = document.getElementById('tripDestination').value.trim();
      // Typing invalidates whatever was picked from the dropdown before —
      // only a fresh selectSuggestion() call (below) sets this again.
      selectedDestinationCountry = null;

      /* autocomplete */
      clearTimeout(acDebounce);
      if (dest.length >= 1) {
        acDebounce = setTimeout(() => {
          fetchSuggestions(dest).then(showDropdown);
        }, 260);
      } else {
        hideDropdown();
      }

      /* (map flies on autocomplete selection) */
      scheduleWeatherFetch();
    });

    document.getElementById('tripDestination').addEventListener('blur', () => {
      setTimeout(hideDropdown, 150);
    });

    document.getElementById('tripDestination').addEventListener('focus', () => {
      const dest = document.getElementById('tripDestination').value.trim();
      if (dest.length >= 1) fetchSuggestions(dest).then(showDropdown);
    });

    document.getElementById('tripFromDate').addEventListener('change', () => { updatePreview(); scheduleWeatherFetch(); });
    document.getElementById('tripToDate').addEventListener('change',   () => { updatePreview(); scheduleWeatherFetch(); });

    /* ── Save ── */
    document.getElementById('saveTripBtn').addEventListener('click', async function () {
      const tripName       = document.getElementById('tripName').value.trim();
      const destination    = document.getElementById('tripDestination').value.trim();
      const fromDate       = document.getElementById('tripFromDate').value;
      const toDate         = document.getElementById('tripToDate').value;
      const notes          = document.getElementById('tripNotes').value;

      if (!destination) {
        document.getElementById('tripDestination').focus();
        document.getElementById('tripDestination').style.borderColor = '#c0392b';
        document.getElementById('tripDestination').style.boxShadow   = '0 0 0 3px rgba(192,57,43,0.12)';
        setTimeout(() => {
          document.getElementById('tripDestination').style.borderColor = '';
          document.getElementById('tripDestination').style.boxShadow   = '';
        }, 2000);
        return;
      }

      this.disabled  = true;
      this.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" style="animation:spin 0.8s linear infinite"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0"/></svg> Saving…`;

      const activityCategories = Array.from(document.querySelectorAll('.activity-chip.selected'))
        .map(el => el.dataset.category);

      const inviteCode = generateInviteCode();
      const tripId     = Date.now().toString(36);

      const tripData = {
        id: tripId, name: tripName || null, destination, fromDate, toDate, travelers,
        activityCategories, activities: [], notes,
        airline: selectedAirline || null,
        // From the geocoding dropdown selection above — null if the user
        // typed a destination without picking a suggestion. Used by
        // buildTripProfile() (lib/packing-items.js) to suggest Passport
        // only for international trips.
        destinationCountry: selectedDestinationCountry,
        inviteCode, weatherTags, createdAt: new Date().toISOString(),
        ownerEmail: Auth.getSession()?.email || null,
      };

      const imageUrl = await fetchCityImage(destination);
      if (imageUrl) tripData.imageUrl = imageUrl;

      /* save to trips registry + Supabase */
      const result = await DB.saveTrip(tripData);
      if (!result.success) {
        alert('Your trip could not be saved. Please check your connection and try again.');
        this.disabled  = false;
        this.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Create Trip';
        return;
      }
      DB.savePackState(tripId, { itemState: {}, dismissed: [], customItems: {} });

      pushNotification('trip', `Your trip to ${destination} has been created!`, destination);
      location.href = 'tripPreview.html';
    });

    /* spinner keyframe */
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    (function () {
      let toPickr;
      const fromPickr = flatpickr('#tripFromDate', {
        dateFormat: 'Y-m-d',
        altInput: true,
        altFormat: 'M j, Y',
        altInputClass: 'nt-date-input',
        minDate: 'today',
        disableMobile: true,
        onChange(selectedDates, dateStr) {
          document.getElementById('tripFromDate').dispatchEvent(new Event('change'));
          if (toPickr) {
            toPickr.set('minDate', dateStr || 'today');
            // Auto-open return date picker after departure is chosen
            setTimeout(() => toPickr.open(), 120);
          }
        }
      });
      toPickr = flatpickr('#tripToDate', {
        dateFormat: 'Y-m-d',
        altInput: true,
        altFormat: 'M j, Y',
        altInputClass: 'nt-date-input',
        minDate: 'today',
        disableMobile: true,
        onChange() {
          document.getElementById('tripToDate').dispatchEvent(new Event('change'));
        }
      });
    })();
  </script>
