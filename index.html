<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="lib/deep-link.js"></script>
  <script>
    /* App-only: pinch/double-tap zoom reads as a bug in a native app
       (nothing here is meant to be zoomable), but disabling it on the
       public website would hurt pinch-zoom accessibility for browser
       visitors - so this only overrides the viewport inside Capacitor. */
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
    }
  </script>
  <!-- Google tag (gtag.js) - gated on Profile > Privacy > Analytics (default on) -->
  <script>
    (function () {
      var on = true;
      try { on = (JSON.parse(localStorage.getItem('pm_profile') || '{}').privacy || {}).analytics ?? true; } catch (e) {}
      if (!on) return;
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag("js", new Date());
      gtag("config", "G-5QYXT3Q3HW");
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-5QYXT3Q3HW';
      document.head.appendChild(s);
    })();
  </script>
  <title>Packmates AI — Home</title>
  <meta name="description" content="Plan trips, split packing lists, and travel together with your crew on Packmates AI.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Packmates AI — Home">
  <meta property="og:description" content="Plan trips, split packing lists, and travel together with your crew on Packmates AI.">
  <meta property="og:image" content="https://packmatesai.com/img/discover-hero.jpg">
  <meta property="og:url" content="https://packmatesai.com/">
  <meta name="google-site-verification" content="FtcIhrg7MwqpfFtZg5P0KzcM8qUOzmA5qyQ91YyoSQI" />
  <meta name="google-site-verification" content="mbES5Y_wIsmWjwwLcLBDGU7SUN4yYBEEc1M1H5zSEw4" />
  <link rel="icon" type="image/png" href="img/appIcon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d3347">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <!-- ══════════ SIDEBAR ══════════ -->
  <nav class="sidebar" data-page="index.html"></nav>
  <script src="nav.js"></script>

  <!-- ══════════ MAIN ══════════ -->
  <main>

    <!-- Header -->
    <div class="dash-header">
      <div class="dash-header-top">
        <div class="dash-greeting">
          <h1 id="greetingText">Good Morning</h1>
          <div class="dash-greeting-name-row">
            <span class="dash-greeting-name" id="greetingName"></span>
            <img class="dash-greeting-icon" id="greetingIcon" src="" alt="" style="display:none">
          </div>
        </div>
        <div class="dash-header-icons">
          <div class="dash-avatar" id="dashAvatar" onclick="pmGoTab('profile.html')" title="Profile">
            <span id="dashAvatarInitials">?</span>
            <img id="dashAvatarImg" src="" alt="Profile photo">
          </div>
          <button class="dash-icon-btn" onclick="pmGoTab('notifications.html')" aria-label="Notifications" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          </button>
        </div>
      </div>
      <div class="dash-header-controls">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="homeSearchInput" placeholder="Search destinations…" autocomplete="off">
          <div class="home-search-dd" id="homeSearchDd" style="display:none"></div>
        </div>
        <button class="btn-new-trip" onclick="location.href='newTrip.html'">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Trip
        </button>
      </div>
    </div>

    <!-- Micro-stats -->
    <div class="dash-stats">
      <div class="dash-stat">
        <span class="dash-stat-num" id="statTrips" style="color:var(--navy)">—</span>
        <span class="dash-stat-lbl">Trips</span>
      </div>
      <div class="dash-stat">
        <span class="dash-stat-num" id="statPacked" style="color:var(--green)">—</span>
        <span class="dash-stat-lbl">Items Packed</span>
      </div>
      <div class="dash-stat">
        <span class="dash-stat-num" id="statDest" style="color:var(--teal-a)">—</span>
        <span class="dash-stat-lbl">Destinations</span>
      </div>
    </div>

    <!-- ══════════ BENTO GRID ══════════ -->
    <div class="bento" id="bentoGrid">
      <!-- rendered by JS -->
    </div>

    <!-- Others Also Packed -->
    <div class="bento-section" id="packedSection">
      <div class="bento-section-header">
        <h2>Others Also Packed</h2>
        <div class="bento-section-line"></div>
      </div>
      <div class="packed-strip" id="packedStrip"></div>
    </div>

    <!-- Explore Destinations -->
    <div class="bento-section">
      <div class="bento-section-header">
        <h2>Explore Destinations</h2>
        <div class="bento-section-line"></div>
        <a href="discover.html" style="font-size:0.68rem;font-weight:700;color:var(--green);text-decoration:none;white-space:nowrap;letter-spacing:0.04em;transition:opacity 0.2s" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">See all →</a>
      </div>
      <div class="explore-strip" id="exploreStrip"></div>
    </div>

    <!-- Your Trips -->
    <div class="trips-grid-wrap" id="tripsSection">
      <div class="bento-section-header">
        <h2>Your Trips</h2>
        <div class="bento-section-line"></div>
      </div>
      <div class="trips-grid" id="tripsGrid"></div>
    </div>

  </main>

  <div class="toast" id="toast"></div>

  <!-- Confirm modal (delete / leave trip) -->
  <div class="confirm-backdrop" id="confirmBackdrop">
    <div class="confirm-modal">
      <div class="confirm-icon" id="confirmIcon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </div>
      <div class="confirm-title" id="confirmTitle">Delete trip?</div>
      <div class="confirm-message" id="confirmMessage"></div>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-btn--ghost" id="confirmCancelBtn">Cancel</button>
        <button class="confirm-btn confirm-btn--danger" id="confirmOkBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="lib/sync-guard.js"></script>
  <script src="auth.js"></script>
  <script src="notifications.js"></script>
  <script src="airlines.js"></script>
  <script src="packing-icons.js"></script>
  <script src="lib/packing-math.js"></script>
  <script src="index.js"></script>

  <nav class="bottom-nav">
    <button class="bn-btn active" data-tab="index.html" onclick="location.href='index.html'">
      <svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button class="bn-btn" data-tab="discover.html" onclick="location.href='discover.html'">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      Discover
    </button>
    <button class="bn-btn" data-tab="packing-list.html" onclick="location.href='packing-list.html'">
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
      Packing
    </button>
    <button class="bn-btn" data-tab="newTrip.html" onclick="location.href='newTrip.html'">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      New Trip
    </button>
    <button class="bn-btn" data-tab="profile.html" onclick="location.href='profile.html'">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </button>
  </nav>
  <script src="lib/app-shell.js"></script>
  <script src="lib/capacitor-nav.js"></script>
</body>
</html>
