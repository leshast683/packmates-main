<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packmates</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Allow hero to break out of main's side padding ── */
        main { overflow-x: clip; }

        /* ── Hero card — full-width ── */
        .hero-card {
            position: relative;
            border-radius: 0 0 24px 24px;
            overflow: hidden;
            height: 240px;
            background: #113a58;
            /* Break out of main's 10% side padding (10%/80% = 12.5% of content width) */
            margin: 16px -12.5% 24px;
            width: calc(100% + 25%);
            cursor: pointer;
            box-shadow: 0 6px 28px rgba(0,0,0,0.18);
        }
        .hero-card-bg {
            position: absolute;
            /* Slightly oversized so parallax shift doesn't reveal edges */
            inset: -8%;
            background-size: cover;
            background-position: center;
            transition: transform 0.12s ease-out;
        }
        .hero-card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(17,58,88,0.93) 45%, rgba(17,58,88,0.3));
        }
        .hero-card-body {
            position: relative; z-index: 1;
            padding: 22px 24px;
            height: 100%;
            display: flex;
            gap: 16px;
        }
        /* Left column */
        .hero-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }
        .hero-card-title {
            font-family: 'Blauer Nue', sans-serif;
            font-size: 1.65rem;
            color: #fff;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hero-card-dates {
            font-size: 0.74rem;
            color: rgba(255,255,255,0.65);
            margin-top: 3px;
        }
        .hero-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .hero-card-countdown {
            background: #5f9d30;
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .hero-weather-badge {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(6px);
            border-radius: 999px;
            padding: 3px 10px;
            color: #fff;
            font-size: 0.68rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .hero-chips {
            display: flex; gap: 5px; flex-wrap: wrap;
        }
        .hero-chip {
            font-size: 0.6rem;
            background: rgba(255,255,255,0.13);
            color: #fff;
            padding: 2px 7px;
            border-radius: 999px;
        }
        .hero-share-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.68rem;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            align-self: flex-start;
        }
        .hero-share-btn:hover { background: rgba(255,255,255,0.25); }

        /* Right column — progress ring */
        .hero-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            gap: 4px;
        }
        .progress-ring-label {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.65);
            text-align: center;
            white-space: nowrap;
        }

        /* ── Empty state ── */
        .empty-state {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 48px 20px; gap: 10px;
            background: #fff; border-radius: 18px;
            margin: 20px 0 20px; border: 2px dashed #cdd6de;
        }
        .empty-state-icon { font-size: 3rem; line-height: 1; }
        .empty-state h3 { font-size: 1.05rem; color: #113a58; margin: 4px 0 0; }
        .empty-state p { font-size: 0.82rem; color: #6b7f8e; max-width: 280px; line-height: 1.5; margin: 0; }

        /* ── Tip card ── */
        .tip-card {
            background: linear-gradient(135deg, #113a58, #1a5480);
            border-radius: 14px; padding: 14px 18px;
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 20px; color: #fff;
        }
        .tip-icon { font-size: 1.6rem; flex-shrink: 0; }
        .tip-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.65; margin-bottom: 3px; }
        .tip-text { font-size: 0.8rem; line-height: 1.45; }

        /* ── Explore strip ── */
        .explore-section { margin-bottom: 4px; }
        .explore-section h2 { margin-bottom: 10px; }
        .explore-strip {
            display: flex; gap: 12px; overflow-x: auto;
            padding: 4px 2px 12px; scrollbar-width: none;
        }
        .explore-strip::-webkit-scrollbar { display: none; }
        .explore-card {
            flex-shrink: 0; width: 110px; height: 75px;
            border-radius: 12px; cursor: pointer; position: relative;
            overflow: hidden; transition: transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .explore-card:hover { transform: scale(1.05); }
        .explore-card-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            transition: transform 0.3s;
        }
        .explore-card:hover .explore-card-bg { transform: scale(1.08); }
        .explore-card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.65) 50%, transparent);
        }
        .explore-card-label {
            position: absolute; bottom: 6px; left: 8px;
            color: #fff; font-size: 0.68rem; font-weight: 700; z-index: 1;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .explore-card-emoji {
            position: absolute; top: 6px; right: 7px;
            font-size: 1rem; z-index: 1;
        }

        /* ── Others also packed ── */
        .packed-section { margin-bottom: 20px; }
        .packed-section h2 { margin-bottom: 10px; }
        .packed-items {
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .packed-item-chip {
            display: flex; align-items: center; gap: 6px;
            background: #fff; border: 1.5px solid #dde6ee;
            border-radius: 999px; padding: 5px 12px;
            font-size: 0.75rem; color: #4b5a66;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .packed-item-bar {
            height: 3px; border-radius: 999px; background: #e8f5e0;
            width: 40px; overflow: hidden; flex-shrink: 0;
        }
        .packed-item-bar-fill {
            height: 100%; background: #5f9d30; border-radius: 999px;
        }
        .packed-item-pct {
            font-size: 0.65rem; color: #5f9d30; font-weight: 700;
        }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: #113a58; color: #fff;
            padding: 10px 22px; border-radius: 999px;
            font-size: 0.82rem; opacity: 0;
            transition: all 0.25s; z-index: 999; white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .toast--visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>

<body>
    <nav class="sidebar">
        <div class="brand">
            <img src="img/appIcon.png" alt="Packmates" class="icon">
            <span>Packmates</span>
        </div>
        <div class="nav-buttons">
            <button type="reset" onclick="location.href='index.html'"><img src="img/home.png" alt="" class="icon"><span>Home</span></button>
            <button type="reset" onclick="location.href='discover.html'"><img src="img/calendar.png" alt="" class="icon"><span>Discover</span></button>
            <button type="reset" onclick="location.href='notifications.html'"><img src="img/notif.png" alt="" class="icon"><span>Notifications</span></button>
            <button type="reset" onclick="location.href='profile.html'"><img src="img/profile.png" alt="" class="icon"><span>Profile</span></button>
        </div>
        <div class="nav-bottom">
            <hr>
            <button class="logout" type="reset" onclick="location.href='welcome.html'"><img src="img/home.png" alt="" class="icon"><span>Logout</span></button>
        </div>
    </nav>

    <main>
        <header>
            <div><h1 id="homeGreeting">Welcome, Traveler!</h1></div>
            <button class="primary" type="button" onclick="location.href='newTrip.html'">+ Create New Trip</button>
        </header>

        <input type="text" placeholder="Search Destinations...">

        <div id="heroArea"></div>
        <div id="tipArea"></div>

        <section class="packed-section">
            <h2>Others Also Packed</h2>
            <div class="packed-items" id="packedItems"></div>
        </section>

        <section class="explore-section">
            <h2>Explore Destinations</h2>
            <div class="explore-strip" id="exploreStrip"></div>
        </section>

        <section class="trips">
            <h2>Your Trips</h2>
            <div class="grid" id="tripsGrid"></div>
        </section>
    </main>

    <script>
        // ── Greeting ──
        const hour = new Date().getHours();
        const greetingEl = document.getElementById('homeGreeting');
        if (hour < 12)      greetingEl.textContent = '☀️ Good morning, Traveler!';
        else if (hour < 18) greetingEl.textContent = '⛅ Good afternoon, Traveler!';
        else                greetingEl.textContent = '🌙 Good evening, Traveler!';

        // ── Helpers ──
        function formatDate(d) {
            if (!d) return '';
            const [y, m, day] = d.split('-');
            return `${parseInt(m)}/${parseInt(day)}/${y}`;
        }
        function daysUntil(dateStr) {
            if (!dateStr) return null;
            return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
        }
        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast'; t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.classList.add('toast--visible'), 10);
            setTimeout(() => { t.classList.remove('toast--visible'); setTimeout(() => t.remove(), 300); }, 2500);
        }

        const AVATAR_COLORS = ['#5f9d30','#4a90d9','#e67e22','#9b59b6','#e74c3c','#1abc9c'];

        // ── Weather ──
        const WMO_ICONS = {
            0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',
            51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',
            71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',
            95:'⛈️',96:'⛈️',99:'⛈️',
        };
        async function fetchWeather(city) {
            try {
                const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
                const { results } = await geo.json();
                if (!results?.[0]) return null;
                const { latitude, longitude } = results[0];
                const wx = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&temperature_unit=fahrenheit`);
                const { current_weather: cw } = await wx.json();
                return { temp: Math.round(cw.temperature), icon: WMO_ICONS[cw.weathercode] || '🌡️' };
            } catch { return null; }
        }

        // ── Progress ring SVG ──
        function progressRing(pct) {
            const filled = pct;
            const empty  = 100 - pct;
            return `
            <svg viewBox="0 0 36 36" width="72" height="72">
                <circle cx="18" cy="18" r="15.9" fill="none"
                    stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
                <circle cx="18" cy="18" r="15.9" fill="none"
                    stroke="#5f9d30" stroke-width="3"
                    stroke-dasharray="${filled} ${empty}"
                    stroke-dashoffset="25"
                    stroke-linecap="round"/>
                <text x="18" y="21" text-anchor="middle"
                    fill="#fff" font-size="8" font-weight="700"
                    font-family="Montserrat,sans-serif">${pct}%</text>
            </svg>`;
        }

        // ── Hero area ──
        const tripData     = JSON.parse(localStorage.getItem('currentTrip') || 'null');
        const packingState = JSON.parse(localStorage.getItem('packingState') || '{}');
        const heroArea     = document.getElementById('heroArea');
        const tripsGrid    = document.getElementById('tripsGrid');

        if (!tripData || !tripData.destination) {
            heroArea.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🌍</div>
                    <h3>No trips planned yet</h3>
                    <p>Pack smarter — create your first trip and get a personalized packing list in seconds.</p>
                    <button class="primary" style="margin-top:8px" onclick="location.href='newTrip.html'">✈️ Plan Your First Trip</button>
                </div>`;
        } else {
            const days = daysUntil(tripData.fromDate);
            const countdown = days === null ? '' :
                days > 0  ? `${days} day${days !== 1 ? 's' : ''} away` :
                days === 0 ? '🎉 Today!' : 'Trip ongoing';

            const allKeys    = Object.keys(packingState);
            const packedKeys = allKeys.filter(k => packingState[k]);
            const pct        = allKeys.length ? Math.round(packedKeys.length / allKeys.length * 100) : 0;
            const chips      = (tripData.activityCategories || []).slice(0, 4).map(a => `<span class="hero-chip">${a}</span>`).join('');

            heroArea.innerHTML = `
                <div class="hero-card" id="heroCard">
                    <div class="hero-card-bg" ${tripData.imageUrl ? `style="background-image:url('${tripData.imageUrl}')"` : ''}></div>
                    <div class="hero-card-overlay"></div>
                    <div class="hero-card-body">
                        <div class="hero-left">
                            <div>
                                <div class="hero-card-title">${tripData.destination}</div>
                                <div class="hero-card-dates">${tripData.fromDate && tripData.toDate ? `${formatDate(tripData.fromDate)} – ${formatDate(tripData.toDate)}` : ''}</div>
                            </div>
                            <div class="hero-badges">
                                ${countdown ? `<span class="hero-card-countdown">${countdown}</span>` : ''}
                                <span class="hero-weather-badge" id="weatherBadge">🌡️ ...</span>
                            </div>
                            ${chips ? `<div class="hero-chips">${chips}</div>` : ''}
                            <button class="hero-share-btn" id="shareBtn">↗ Share Trip</button>
                        </div>
                        <div class="hero-right">
                            ${allKeys.length ? progressRing(pct) : ''}
                            ${allKeys.length ? `<div class="progress-ring-label">${packedKeys.length}/${allKeys.length}<br>packed</div>` : ''}
                        </div>
                    </div>
                </div>`;

            document.getElementById('heroCard').addEventListener('click', e => {
                if (!e.target.closest('#shareBtn')) location.href = 'tripPreview.html';
            });

            // Share button
            document.getElementById('shareBtn').addEventListener('click', async e => {
                e.stopPropagation();
                const text = `✈️ I'm heading to ${tripData.destination}!\n📅 ${formatDate(tripData.fromDate)} – ${formatDate(tripData.toDate)}\n🎒 Packed with Packmates`;
                if (navigator.share) {
                    try { await navigator.share({ title: `${tripData.destination} Trip`, text }); } catch {}
                } else {
                    try { await navigator.clipboard.writeText(text); showToast('✓ Trip details copied to clipboard!'); }
                    catch { showToast('⚠️ Could not copy — try manual copy.'); }
                }
            });

            // Weather
            fetchWeather(tripData.destination).then(w => {
                const badge = document.getElementById('weatherBadge');
                if (badge) badge.textContent = w ? `${w.icon} ${w.temp}°F` : '';
            });

            // Parallax on mouse move
            const heroBgEl = document.querySelector('.hero-card-bg');
            document.getElementById('heroCard').addEventListener('mousemove', e => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top)  / rect.height - 0.5;
                if (heroBgEl) heroBgEl.style.transform = `translate(${x * 18}px, ${y * 12}px)`;
            });
            document.getElementById('heroCard').addEventListener('mouseleave', () => {
                if (heroBgEl) heroBgEl.style.transform = 'translate(0, 0)';
            });

            // Trip card in grid
            tripsGrid.innerHTML = `
                <article class="card" style="cursor:pointer" onclick="location.href='tripPreview.html'">
                    <div class="card-img">
                        <img src="${tripData.imageUrl || 'img/placeholderTrip.png'}" alt="${tripData.destination}" style="width:100%;height:100%;object-fit:cover;">
                    </div>
                    <div class="card-body">
                        <h3>${tripData.destination}</h3>
                        <p>${tripData.fromDate && tripData.toDate ? `${formatDate(tripData.fromDate)} – ${formatDate(tripData.toDate)}` : 'Dates not set'}</p>
                        <footer>
                            <div class="avatars" id="cardAvatars"></div>
                            <button type="button" class="arrow" onclick="event.stopPropagation();location.href='tripPreview.html'">&gt;</button>
                        </footer>
                    </div>
                </article>`;

            const cardAvatars = document.getElementById('cardAvatars');
            const travelers   = parseInt(tripData.travelers) || 1;
            for (let i = 0; i < travelers; i++) {
                const dot = document.createElement('span');
                dot.style.background = AVATAR_COLORS[i % AVATAR_COLORS.length];
                dot.textContent = '👤';
                cardAvatars.appendChild(dot);
            }
        }

        // ── Tip of the day ──
        const TIPS = [
            { icon: '🎽', text: 'Roll your clothes instead of folding — saves up to 30% more space in your bag.' },
            { icon: '💊', text: 'Pack medications in your carry-on, never in checked luggage.' },
            { icon: '🔌', text: 'A universal travel adapter works in 150+ countries — one for every trip.' },
            { icon: '📱', text: 'Download offline maps before you leave — WiFi isn\'t always guaranteed.' },
            { icon: '🧦', text: 'Stuff socks inside your shoes to save space and keep shoe shape.' },
            { icon: '💧', text: 'Bring an empty reusable water bottle — fill it after airport security.' },
            { icon: '📋', text: 'Take photos of important docs (passport, insurance) and email them to yourself.' },
            { icon: '🌙', text: 'Pack a sleep mask and earplugs — they make any flight or hotel room better.' },
            { icon: '🧴', text: 'Use solid toiletries (shampoo bars, solid sunscreen) to avoid liquid limits.' },
            { icon: '👟', text: 'Wear your heaviest shoes and jacket on travel day to save bag space.' },
            { icon: '🏷️', text: 'Label your bag with a brightly colored ribbon so it\'s easy to spot on the carousel.' },
            { icon: '🔋', text: 'A power bank with at least 10,000mAh charges most phones 2–3 times.' },
        ];
        const tip = TIPS[Math.floor(Date.now() / 86400000) % TIPS.length];
        document.getElementById('tipArea').innerHTML = `
            <div class="tip-card">
                <div class="tip-icon">${tip.icon}</div>
                <div>
                    <div class="tip-label">Packing Tip of the Day</div>
                    <div class="tip-text">${tip.text}</div>
                </div>
            </div>`;

        // ── Others also packed ──
        const POPULAR = {
            'Beach':           [['Sunscreen',90],['Swimsuit',88],['Beach Towel',85],['Sunglasses',82],['Flip Flops',78]],
            'Hiking':          [['Hiking Boots',92],['Water Bottle',89],['Backpack',87],['Insect Repellent',75],['Snacks',72]],
            'Camping':         [['Tent',95],['Sleeping Bag',93],['Camp Stove',80],['Insect Repellent',77],['Flashlight',74]],
            'Road Trip':       [['Snacks',91],['Car Charger',88],['Travel Pillow',82],['Sunglasses',79],['Water Bottle',76]],
            'Snow Sports':     [['Ski Jacket',94],['Gloves',91],['Thermal Base Layer',88],['Goggles',85],['Wool Socks',80]],
            'Business Trip':   [['Laptop',96],['Business Cards',85],['Dress Shirts',84],['Blazer',81],['Notebook',76]],
            'Night Out':       [['Dress',87],['Heels',82],['Perfume/Cologne',79],['Clutch Purse',75],['Makeup Kit',73]],
            'Baby':            [['Diapers',98],['Baby Wipes',96],['Baby Bottle',90],['Stroller',85],['Baby Blanket',82]],
            'Theme Park':      [['Fanny Pack',88],['Comfortable Shoes',86],['Sunscreen',81],['Water Bottle',79],['Camera',74]],
            'Festival':        [['Tent',83],['Fanny Pack',80],['Raincoat',77],['Sunglasses',75],['Power Bank',73]],
            'City Sightseeing':[['Camera',89],['Comfortable Shoes',87],['Backpack',84],['Water Bottle',78],['Travel Guidebook',70]],
            'Dining':          [['Dress Shoes',88],['Blazer',84],['Dress',80],['Button-Down Shirts',76],['Tie',65]],
            'Gym':             [['Workout Clothes',95],['Sports Shoes',92],['Gym Towel',87],['Water Bottle',84],['Earbuds',79]],
            'Swimming':        [['Swimsuit',96],['Goggles',88],['Towel',85],['Swim Cap',76],['Flip Flops',74]],
            '_default':        [['Passport',97],['Phone Charger',95],['Power Bank',90],['Comfortable Shoes',85],['Travel Adapter',80]],
        };

        const activities = tripData?.activityCategories?.length ? tripData.activityCategories : ['_default'];
        const seen = new Set();
        const popularItems = [];
        activities.forEach(act => {
            (POPULAR[act] || POPULAR['_default']).forEach(([name, pct]) => {
                if (!seen.has(name)) { seen.add(name); popularItems.push([name, pct]); }
            });
        });
        const top6 = popularItems.slice(0, 6);

        document.getElementById('packedItems').innerHTML = top6.map(([name, pct]) => `
            <div class="packed-item-chip">
                <span>${name}</span>
                <div class="packed-item-bar"><div class="packed-item-bar-fill" style="width:${pct}%"></div></div>
                <span class="packed-item-pct">${pct}%</span>
            </div>`).join('');

        // ── Explore destinations ──
        const DESTINATIONS = [
            { name: 'Paris',      emoji: '🗼', bg: 'linear-gradient(135deg,#4a6fa5,#2c3e50)' },
            { name: 'Bali',       emoji: '🌺', bg: 'linear-gradient(135deg,#e67e22,#c0392b)' },
            { name: 'New York',   emoji: '🗽', bg: 'linear-gradient(135deg,#2c3e50,#3498db)' },
            { name: 'Tokyo',      emoji: '⛩️', bg: 'linear-gradient(135deg,#c0392b,#8e44ad)' },
            { name: 'Cancun',     emoji: '🏖️', bg: 'linear-gradient(135deg,#00b09b,#0099cc)' },
            { name: 'Dubai',      emoji: '🏙️', bg: 'linear-gradient(135deg,#f7971e,#ffd200)' },
            { name: 'Rome',       emoji: '🏛️', bg: 'linear-gradient(135deg,#d35400,#e74c3c)' },
            { name: 'Santorini',  emoji: '🌊', bg: 'linear-gradient(135deg,#1a78c2,#00c6ff)' },
            { name: 'Maldives',   emoji: '🐠', bg: 'linear-gradient(135deg,#00b4db,#0083b0)' },
            { name: 'Banff',      emoji: '🏔️', bg: 'linear-gradient(135deg,#2d6a4f,#1b4332)' },
            { name: 'Barcelona',  emoji: '🎨', bg: 'linear-gradient(135deg,#f093fb,#c0392b)' },
            { name: 'Sydney',     emoji: '🦘', bg: 'linear-gradient(135deg,#4facfe,#00f2fe)' },
        ];
        const strip = document.getElementById('exploreStrip');
        DESTINATIONS.forEach(dest => {
            const card = document.createElement('div');
            card.className = 'explore-card';
            card.innerHTML = `
                <div class="explore-card-bg" style="background:${dest.bg}"></div>
                <div class="explore-card-overlay"></div>
                <div class="explore-card-emoji">${dest.emoji}</div>
                <div class="explore-card-label">${dest.name}</div>`;
            card.addEventListener('click', () => {
                localStorage.setItem('exploreDestination', dest.name);
                location.href = 'newTrip.html';
            });
            strip.appendChild(card);
        });
    </script>
</body>

</html>
