<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Packmates</title>
  <meta name="description" content="This page doesn't exist. Head back to Packmates and keep planning your trip.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Page Not Found — Packmates">
  <meta property="og:description" content="This page doesn't exist. Head back to Packmates and keep planning your trip.">
  <meta property="og:image" content="https://packmatesai.com/img/discover-hero.jpg">
  <meta property="og:url" content="https://packmatesai.com/404.html">
  <link rel="icon" type="image/png" href="img/appIcon.png">
  <style>
    @font-face { font-family:'Blauer Nue'; src:url('font/Blauer-Nue-Heavy-iF6626350c62afa.otf') format('opentype'); font-weight:700; }
    @font-face { font-family:'Montserrat'; src:url('font/Montserrat-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'Montserrat'; src:url('font/Montserrat-Medium.ttf') format('truetype'); font-weight:500; }
    @font-face { font-family:'Montserrat'; src:url('font/Montserrat-ExtraBold.ttf') format('truetype'); font-weight:800; }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }

    :root {
      --teal-2: #0d3347;
      --green:  #5f9d30;
      --green2: #7cc63e;
    }

    body {
      font-family:'Montserrat', sans-serif;
      background: var(--teal-2);
      color:#fff;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;
      position:relative;
      padding:24px;
    }

    .orb {
      position:fixed;
      border-radius:50%;
      filter:blur(80px);
      pointer-events:none;
      z-index:0;
    }
    .orb-1 {
      width:700px; height:700px;
      top:-200px; left:-100px;
      background:radial-gradient(circle, rgba(26,88,120,0.55), transparent 70%);
      animation:drift1 18s ease-in-out infinite;
    }
    .orb-2 {
      width:500px; height:500px;
      bottom:-150px; right:45%;
      background:radial-gradient(circle, rgba(95,157,48,0.14), transparent 70%);
      animation:drift2 22s ease-in-out infinite;
    }
    .orb-3 {
      width:450px; height:450px;
      top:30%; right:-50px;
      background:radial-gradient(circle, rgba(34,114,160,0.35), transparent 70%);
      animation:drift3 26s ease-in-out infinite;
    }
    @keyframes drift1 {
      0%,100% { transform:translate(0,0) scale(1); }
      33%      { transform:translate(60px,40px) scale(1.1); }
      66%      { transform:translate(-30px,80px) scale(0.95); }
    }
    @keyframes drift2 {
      0%,100% { transform:translate(0,0) scale(1); }
      50%      { transform:translate(-80px,-60px) scale(1.15); }
    }
    @keyframes drift3 {
      0%,100% { transform:translate(0,0); }
      40%      { transform:translate(50px,-80px); }
      70%      { transform:translate(-20px,40px); }
    }

    .content {
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      animation:fadeUp 0.6s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .logo-row {
      display:flex;
      align-items:center;
      gap:11px;
      margin-bottom:48px;
    }
    .logo-row img {
      width:34px; height:34px;
      border-radius:9px;
      box-shadow:0 4px 16px rgba(0,0,0,0.4);
    }
    .logo-name {
      font-family:'Blauer Nue', sans-serif;
      font-weight:700;
      font-size:0.9rem;
      letter-spacing:0.18em;
      text-transform:uppercase;
    }

    .code {
      font-family:'Blauer Nue', sans-serif;
      font-weight:700;
      font-size:7rem;
      line-height:1;
      letter-spacing:-0.02em;
      background:linear-gradient(135deg, #fff, var(--green2));
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:14px;
    }

    h1 {
      font-family:'Blauer Nue', sans-serif;
      font-weight:700;
      font-size:1.5rem;
      letter-spacing:-0.01em;
      margin-bottom:10px;
    }

    p {
      font-size:0.9rem;
      color:rgba(255,255,255,0.6);
      max-width:360px;
      line-height:1.6;
      margin-bottom:32px;
    }

    .btn-primary {
      padding:14px 32px;
      background:var(--green);
      color:#fff;
      border:none;
      border-radius:12px;
      font-family:'Montserrat', sans-serif;
      font-size:0.82rem;
      font-weight:700;
      cursor:pointer;
      transition:all 0.22s ease;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn-primary:hover {
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(95,157,48,0.4);
    }
    .btn-primary:active { transform:translateY(0); }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="content">
    <div class="logo-row">
      <img src="img/appIcon.png" alt="Packmates">
      <span class="logo-name">Packmates</span>
    </div>

    <div class="code">404</div>
    <h1>This page packed its bags</h1>
    <p>We couldn't find what you're looking for. It may have moved, or the link might be off.</p>

    <a href="index.html" class="btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
      Back to Home
    </a>
  </div>
</body>
</html>
