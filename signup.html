<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packmates — Create Account</title>
  <style>
    @font-face { font-family:'Blauer Nue'; src:url('font/Blauer-Nue-Heavy-iF6626350c62afa.otf') format('opentype'); font-weight:700; }
    @font-face { font-family:'Montserrat'; src:url('font/Montserrat-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'Montserrat'; src:url('font/Montserrat-Medium.ttf') format('truetype'); font-weight:500; }
    @font-face { font-family:'Montserrat'; src:url('font/Montserrat-ExtraBold.ttf') format('truetype'); font-weight:700; }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    :root {
      --green: #5f9d30;
      --green-dark: #4d8225;
      --navy: #0d1b2a;
    }

    body {
      min-height:100vh;
      font-family:'Montserrat', sans-serif;
      background:var(--navy);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      overflow:hidden;
      position:relative;
    }

    .orb {
      position:fixed;
      border-radius:50%;
      filter:blur(80px);
      pointer-events:none;
    }
    .orb-1 {
      width:500px; height:500px;
      top:-100px; left:-80px;
      background:radial-gradient(circle, rgba(95,157,48,0.1), transparent 70%);
      animation:drift 22s ease-in-out infinite;
    }
    .orb-2 {
      width:400px; height:400px;
      bottom:-120px; right:-60px;
      background:radial-gradient(circle, rgba(17,58,88,0.65), transparent 70%);
      animation:drift 18s 2s ease-in-out infinite reverse;
    }
    @keyframes drift {
      0%,100%{ transform:translate(0,0); }
      50%    { transform:translate(50px,-50px); }
    }

    body::after {
      content:'';
      position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      pointer-events:none;
      z-index:0;
    }

    .card {
      position:relative; z-index:1;
      width:100%;
      max-width:440px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:24px;
      padding:40px 40px 36px;
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      box-shadow:0 32px 80px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
      animation:slideUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(32px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    .logo {
      display:flex; align-items:center; justify-content:center;
      gap:10px; margin-bottom:28px;
    }
    .logo img { width:34px; height:34px; border-radius:9px; box-shadow:0 4px 16px rgba(0,0,0,0.4); }
    .logo-name {
      font-family:'Blauer Nue', sans-serif; font-weight:700;
      font-size:1rem; letter-spacing:0.15em; text-transform:uppercase; color:#fff;
    }

    h1 {
      font-family:'Blauer Nue', sans-serif; font-size:1.75rem;
      font-weight:700; letter-spacing:-0.025em; color:#fff;
      text-align:center; margin-bottom:4px;
    }
    .sub {
      text-align:center; font-size:0.78rem;
      color:rgba(255,255,255,0.38); font-weight:500; margin-bottom:24px;
    }

    .msg {
      border-radius:10px; padding:10px 14px; margin-bottom:14px;
      font-size:0.78rem; text-align:left; display:none;
    }
    .msg.error   { background:rgba(220,50,50,0.15); border:1px solid rgba(220,50,50,0.25); color:#ff8a8a; display:block; }
    .msg.success { background:rgba(95,157,48,0.15); border:1px solid rgba(95,157,48,0.25); color:#a0e060; display:block; }

    .form { display:flex; flex-direction:column; }

    .field-label {
      font-size:0.68rem; font-weight:700; letter-spacing:0.1em;
      text-transform:uppercase; color:rgba(255,255,255,0.5);
      margin-bottom:7px; display:block;
    }

    .field { position:relative; margin-bottom:14px; }

    .field input {
      width:100%;
      padding:13px 16px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px;
      font-family:'Montserrat', sans-serif;
      font-size:0.9rem;
      color:#fff;
      outline:none;
      transition:border-color 0.2s, background 0.2s, box-shadow 0.2s;
      margin:0;
    }
    .field input::placeholder { color:rgba(255,255,255,0.25); }
    .field input:focus {
      border-color:var(--green);
      background:rgba(255,255,255,0.1);
      box-shadow:0 0 0 3px rgba(95,157,48,0.15);
    }
    .field input.has-toggle { padding-right:62px; }

    .toggle-pw {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      background:none; border:none; color:rgba(255,255,255,0.3);
      font-family:'Montserrat', sans-serif; font-size:0.72rem; font-weight:600;
      cursor:pointer; transition:color 0.2s; padding:0;
    }
    .toggle-pw:hover { color:rgba(255,255,255,0.7); }

    /* Strength bars */
    .strength-bars {
      display:flex; gap:4px; margin-bottom:4px;
    }
    .strength-bars span {
      flex:1; height:3px; border-radius:99px;
      background:rgba(255,255,255,0.1);
      transition:background 0.3s;
    }
    .strength-hint {
      font-size:0.65rem; color:rgba(255,255,255,0.35);
      margin-bottom:12px; min-height:16px;
    }

    .btn-submit {
      width:100%;
      padding:14px;
      background:var(--green);
      color:#fff;
      border:none;
      border-radius:12px;
      font-family:'Montserrat', sans-serif;
      font-size:0.82rem;
      font-weight:700;
      cursor:pointer;
      transition:all 0.22s;
      margin-bottom:20px;
      position:relative; overflow:hidden;
    }
    .btn-submit::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity:0; transition:opacity 0.2s;
    }
    .btn-submit:hover::before { opacity:1; }
    .btn-submit:hover { background:#52892a; transform:translateY(-1px); box-shadow:0 8px 20px rgba(95,157,48,0.35); }
    .btn-submit:active { transform:translateY(0); }

    .switch {
      text-align:center; font-size:0.78rem; color:rgba(255,255,255,0.4);
    }
    .switch a { color:var(--green); text-decoration:none; font-weight:700; transition:opacity 0.2s; }
    .switch a:hover { opacity:0.8; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="logo">
      <img src="img/appIcon.png" alt="Packmates">
      <span class="logo-name">Packmates</span>
    </div>

    <h1>Create Account</h1>
    <p class="sub">Join and start your first trip today</p>

    <div class="msg" id="msg"></div>

    <form class="form" onsubmit="handleSignup(event)">
      <label class="field-label" for="name">Full Name</label>
      <div class="field">
        <input type="text" id="name" placeholder="Your name" required>
      </div>

      <label class="field-label" for="email">Email</label>
      <div class="field">
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <label class="field-label" for="password">Password</label>
      <div class="field">
        <input type="password" id="password" class="has-toggle" placeholder="Min. 8 characters" required oninput="checkStrength(this.value)">
        <button type="button" class="toggle-pw" onclick="togglePassword('password',this)">Show</button>
      </div>
      <div class="strength-bars">
        <span id="b1"></span><span id="b2"></span>
        <span id="b3"></span><span id="b4"></span>
      </div>
      <div class="strength-hint" id="shint"></div>

      <label class="field-label" for="confirm">Confirm Password</label>
      <div class="field">
        <input type="password" id="confirm" class="has-toggle" placeholder="Repeat password" required>
        <button type="button" class="toggle-pw" onclick="togglePassword('confirm',this)">Show</button>
      </div>

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="switch">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) location.replace('index.html');

    function togglePassword(id, btn) {
      const el = document.getElementById(id);
      const show = el.type === 'text';
      el.type = show ? 'password' : 'text';
      btn.textContent = show ? 'Show' : 'Hide';
    }

    function checkStrength(val) {
      const bars   = [1,2,3,4].map(i => document.getElementById('b'+i));
      const hint   = document.getElementById('shint');
      const colors = ['#e74c3c','#e67e22','#f1c40f','#5f9d30'];
      const labels = ['Weak','Fair','Good','Strong'];
      let score = 0;
      if (val.length >= 8)            score++;
      if (/[A-Z]/.test(val))          score++;
      if (/[0-9]/.test(val))          score++;
      if (/[^A-Za-z0-9]/.test(val))   score++;
      bars.forEach((b,i) => { b.style.background = i < score ? colors[score-1] : 'rgba(255,255,255,0.1)'; });
      hint.textContent = val.length ? (labels[score-1] || '') : '';
      hint.style.color = val.length ? colors[score-1] : '';
    }

    function handleSignup(e) {
      e.preventDefault();
      const msg     = document.getElementById('msg');
      const name    = document.getElementById('name').value.trim();
      const email   = document.getElementById('email').value.trim();
      const pw      = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      msg.className = 'msg';
      if (pw !== confirm) { msg.className='msg error'; msg.textContent='Passwords do not match.'; return; }
      const result = Auth.register(name, email, pw);
      if (result.success) {
        msg.className='msg success'; msg.textContent='Account created! Redirecting…';
        setTimeout(() => location.href='index.html', 900);
      } else {
        msg.className='msg error'; msg.textContent=result.error;
      }
    }
  </script>
</body>
</html>
