<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5QYXT3Q3HW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-5QYXT3Q3HW");
  </script>
  <title>Create a Free Account — Packmates AI Packing List App</title>
  <meta name="description" content="Create a free Packmates AI account and start building smart packing lists for your next trip.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Create a Free Account — Packmates AI Packing List App">
  <meta property="og:description" content="Create a free Packmates AI account and start building smart packing lists for your next trip.">
  <meta property="og:image" content="https://packmatesai.com/img/discover-hero.jpg">
  <meta property="og:url" content="https://packmatesai.com/signup.html">
  <link rel="canonical" href="https://packmatesai.com/signup.html">
  <link rel="icon" type="image/png" href="img/appIcon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d3347">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="standalone.css">
  <style>

    :root {
      --green: #5f9d30;
      --green-dark: #4d8225;
      --navy: #0d1b2a;
    }

    body {
      min-height:100vh;
      font-family:'Montserrat', sans-serif;
      background-color:#2ab5b5;
      background-image:url('img/world-map-bg.png');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      overflow-y:auto;
      position:relative;
      opacity:0;
      transition:opacity 0.55s ease;
    }

    body::before {
      content:'';
      position:fixed; inset:0;
      background:rgba(0,0,0,0.28);
      pointer-events:none;
      z-index:0;
    }

    body::after {
      content:'';
      position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events:none;
      z-index:0;
    }

    .card {
      position:relative; z-index:1;
      width:100%;
      max-width:440px;
      background:rgba(4,30,30,0.62);
      border:1px solid rgba(255,255,255,0.13);
      border-radius:24px;
      padding:40px 40px 36px;
      backdrop-filter:blur(28px);
      -webkit-backdrop-filter:blur(28px);
      box-shadow:0 32px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .logo {
      display:flex; align-items:center; justify-content:center;
      gap:10px; margin-bottom:28px;
    }
    .logo-name {
      font-family:'Blauer Nue', sans-serif; font-weight:700;
      font-size:1rem; letter-spacing:0.15em; text-transform:uppercase; color:#fff;
    }

    h1 {
      font-family:'Blauer Nue', sans-serif; font-size:1.75rem;
      font-weight:700; letter-spacing:-0.025em; color:#fff;
      text-align:center; margin-bottom:4px;
    }
    .sub {
      text-align:center; font-size:0.78rem;
      color:rgba(255,255,255,0.38); font-weight:500; margin-bottom:24px;
    }

    .msg {
      border-radius:10px; padding:10px 14px; margin-bottom:14px;
      font-size:0.78rem; text-align:left; display:none;
    }

    .field { position:relative; margin-bottom:14px; }

    .field input {
      width:100%;
      padding:13px 16px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px;
      font-family:'Montserrat', sans-serif;
      font-size:0.9rem;
      color:#fff;
      outline:none;
      transition:border-color 0.2s, background 0.2s, box-shadow 0.2s;
      margin:0;
    }
    .field input.has-toggle { padding-right:62px; }

    .toggle-pw {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      background:none; border:none; color:rgba(255,255,255,0.3);
      font-family:'Montserrat', sans-serif; font-size:0.72rem; font-weight:600;
      cursor:pointer; transition:color 0.2s; padding:0;
    }

    /* Strength bars */
    .strength-bars {
      display:flex; gap:4px; margin-bottom:4px;
    }
    .strength-bars span {
      flex:1; height:3px; border-radius:99px;
      background:rgba(255,255,255,0.1);
      transition:background 0.3s;
    }
    .strength-hint {
      font-size:0.65rem; color:rgba(255,255,255,0.35);
      margin-bottom:12px; min-height:16px;
    }

    .btn-submit {
      width:100%;
      padding:14px;
      background:var(--green);
      color:#fff;
      border:none;
      border-radius:12px;
      font-family:'Montserrat', sans-serif;
      font-size:0.82rem;
      font-weight:700;
      cursor:pointer;
      transition:all 0.22s;
      margin-bottom:20px;
      position:relative; overflow:hidden;
    }
    .btn-submit:active { transform:translateY(0); }

    .gender-group {
      display:flex; gap:10px; margin-bottom:18px;
    }
    .gender-btn {
      flex:1; padding:18px 8px 14px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:14px;
      font-family:'Montserrat', sans-serif;
      font-size:0.67rem; font-weight:700; letter-spacing:0.04em;
      color:rgba(255,255,255,0.45);
      cursor:pointer;
      transition:all 0.18s;
      display:flex; flex-direction:column; align-items:center; gap:10px;
    }
    .gender-btn svg {
      width:30px; height:30px;
      stroke:currentColor; fill:none;
      stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;
      transition:transform 0.18s;
    }
    .gender-btn:hover {
      background:rgba(255,255,255,0.11);
      color:rgba(255,255,255,0.75);
    }
    .gender-btn:hover svg { transform:scale(1.1); }
    .gender-btn.active {
      background:rgba(95,157,48,0.16);
      border-color:rgba(95,157,48,0.7);
      color:#fff;
      box-shadow:0 0 0 3px rgba(95,157,48,0.14);
    }
    .gender-btn.active svg { color:#7dcc40; }

    .switch {
      text-align:center; font-size:0.78rem; color:rgba(255,255,255,0.4);
    }
    .switch a { color:var(--green); text-decoration:none; font-weight:700; transition:opacity 0.2s; }
    .switch a:hover { opacity:0.8; }
    #signupForm, .switch { transition: opacity 0.15s ease; }
    @keyframes dot-bounce {
      0%,80%,100% { transform:translateY(0); opacity:0.4; }
      40%          { transform:translateY(-10px); opacity:1; }
    }
    @media (max-width: 480px) {
      body { padding: 16px; align-items: flex-start; padding-top: 24px; overflow-y: auto; }
      .card { padding: 28px 20px 24px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="img/appIcon.png" alt="Packmates AI">
      <span class="logo-name">Packmates AI</span>
    </div>

    <h1 id="mainTitle">Create Account</h1>
    <p class="sub" id="mainSub">Join and start your first trip today</p>

    <div class="msg" id="msg"></div>

    <!-- Loading screen (shown immediately on submit) -->
    <div id="loadingScreen" style="display:none;text-align:center;padding:24px 0 32px;">
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:20px;">
        <span style="width:10px;height:10px;border-radius:50%;background:#5f9d30;display:inline-block;animation:dot-bounce 1.2s ease-in-out infinite;"></span>
        <span style="width:10px;height:10px;border-radius:50%;background:#5f9d30;display:inline-block;animation:dot-bounce 1.2s ease-in-out 0.2s infinite;"></span>
        <span style="width:10px;height:10px;border-radius:50%;background:#5f9d30;display:inline-block;animation:dot-bounce 1.2s ease-in-out 0.4s infinite;"></span>
      </div>
      <p style="color:rgba(255,255,255,0.45);font-size:0.8rem;">Creating your account…</p>
    </div>

    <!-- Success screen (shown after account created) -->
    <div id="successScreen" style="display:none;text-align:center;padding:8px 0 16px;">
      <div style="width:72px;height:72px;background:rgba(95,157,48,0.15);border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="26" viewBox="0 0 34 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="32" height="22" rx="3" stroke="#7dcc40" stroke-width="2" fill="none"/>
          <path d="M1 5l16 11 16-11" stroke="#7dcc40" stroke-width="2" fill="none" stroke-linejoin="round"/>
          <circle cx="28" cy="5" r="3" fill="#f59e0b"/>
        </svg>
      </div>
      <p style="color:rgba(255,255,255,0.9);font-size:0.9rem;line-height:1.65;margin-bottom:8px;">
        We sent a confirmation link to<br>
        <strong id="confirmedEmail" style="color:#7dcc40;"></strong>
      </p>
      <p style="color:rgba(255,255,255,0.38);font-size:0.75rem;margin-bottom:28px;">
        Click the link in your email to activate your account.
      </p>
      <button onclick="openEmailApp()" class="btn-submit" style="margin-bottom:14px;">
        Check your email →
      </button>
      <div id="resendWrap" style="display:none;margin-top:4px;">
        <a href="#" id="resendLink" style="color:rgba(255,255,255,0.35);font-size:0.75rem;text-decoration:none;" onclick="resendEmail(event)">
          Didn't receive it? Resend email
        </a>
      </div>
    </div>

    <form class="form" id="signupForm" onsubmit="handleSignup(event)">
      <label class="field-label" for="name">Full Name</label>
      <div class="field">
        <input type="text" id="name" placeholder="Your name" required>
      </div>

      <label class="field-label" for="email">Email</label>
      <div class="field">
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <label class="field-label" for="password">Password</label>
      <div class="field">
        <input type="password" id="password" class="has-toggle" placeholder="Min. 8 characters" required oninput="checkStrength(this.value)">
        <button type="button" class="toggle-pw" onclick="togglePassword('password',this)">Show</button>
      </div>
      <div class="strength-bars">
        <span id="b1"></span><span id="b2"></span>
        <span id="b3"></span><span id="b4"></span>
      </div>
      <div class="strength-hint" id="shint"></div>

      <label class="field-label" for="confirm">Confirm Password</label>
      <div class="field">
        <input type="password" id="confirm" class="has-toggle" placeholder="Repeat password" required>
        <button type="button" class="toggle-pw" onclick="togglePassword('confirm',this)">Show</button>
      </div>

      <label class="field-label">Gender</label>
      <div class="gender-group" id="genderGroup">
        <button type="button" class="gender-btn" data-gender="male" onclick="selectGender(this)">
          <svg viewBox="0 0 24 24">
            <circle cx="10" cy="10" r="6"/>
            <line x1="14.2" y1="5.8" x2="20" y2="0"/>
            <polyline points="16 0 20 0 20 4"/>
          </svg>
          Male
        </button>
        <button type="button" class="gender-btn" data-gender="female" onclick="selectGender(this)">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="6"/>
            <line x1="12" y1="14" x2="12" y2="22"/>
            <line x1="8" y1="19" x2="16" y2="19"/>
          </svg>
          Female
        </button>
        <button type="button" class="gender-btn" data-gender="nonbinary" onclick="selectGender(this)">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="10" r="6"/>
            <line x1="12" y1="16" x2="12" y2="22"/>
            <line x1="8.5" y1="19" x2="15.5" y2="19"/>
            <line x1="15.8" y1="5.2" x2="20" y2="1"/>
            <polyline points="17 1 20 1 20 4"/>
          </svg>
          Non-binary
        </button>
      </div>

      <!-- honeypot: hidden from real users, bots fill it in -->
      <input type="text" id="hp_signup" name="hp_name" tabindex="-1" autocomplete="off" aria-hidden="true"
        style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="switch">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="lib/sync-guard.js"></script>
  <script src="auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) location.replace('index.html');

    function togglePassword(id, btn) {
      const el = document.getElementById(id);
      const show = el.type === 'text';
      el.type = show ? 'password' : 'text';
      btn.textContent = show ? 'Show' : 'Hide';
    }

    function checkStrength(val) {
      const bars   = [1,2,3,4].map(i => document.getElementById('b'+i));
      const hint   = document.getElementById('shint');
      const colors = ['#e74c3c','#e67e22','#f1c40f','#5f9d30'];
      const labels = ['Weak','Fair','Good','Strong'];
      let score = 0;
      if (val.length >= 8)            score++;
      if (/[A-Z]/.test(val))          score++;
      if (/[0-9]/.test(val))          score++;
      if (/[^A-Za-z0-9]/.test(val))   score++;
      bars.forEach((b,i) => { b.style.background = i < score ? colors[score-1] : 'rgba(255,255,255,0.1)'; });
      hint.textContent = val.length ? (labels[score-1] || '') : '';
      hint.style.color = val.length ? colors[score-1] : '';
    }

    let selectedGender = null;

    function selectGender(btn) {
      document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedGender = btn.dataset.gender;
    }

    let _signedUpEmail = '';
    let _signedUpPw    = ''; /* kept in memory only — never stored */
    let _pollTimer     = null;

    /* ── Same-browser detection: fires immediately when session is established ── */
    (async function() {
      const sb = await window._pm_sbLoaded;
      if (!sb) return;
      const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
        if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
          subscription.unsubscribe();
          if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
          location.replace('index.html');
        }
      });
    })();

    /* ── Cross-device detection: poll signIn every 5 s until email is confirmed ── */
    async function _startConfirmationPoll() {
      const sb = await window._pm_sbLoaded;
      if (!sb || !_signedUpEmail || !_signedUpPw) return;
      const email = _signedUpEmail, pw = _signedUpPw;
      _pollTimer = setInterval(async () => {
        const { data } = await sb.auth.signInWithPassword({ email, password: pw });
        if (data?.session) {
          clearInterval(_pollTimer); _pollTimer = null; _signedUpPw = '';
          location.replace('index.html');
        }
      }, 5000);
      /* Stop polling after 20 minutes and wipe password from memory */
      setTimeout(() => {
        if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
        _signedUpPw = '';
      }, 20 * 60 * 1000);
    }

    function openEmailApp() {
      window.location.href = 'mailto:';
    }

    async function resendEmail(e) {
      e.preventDefault();
      const link = document.getElementById('resendLink');
      link.textContent = 'Sending…';
      link.style.pointerEvents = 'none';
      const result = await Auth.resendConfirmation(_signedUpEmail);
      if (result.success) {
        link.textContent = 'Sent! Check your inbox.';
        link.style.color = '#7dcc40';
      } else {
        link.textContent = 'Failed — tap to try again';
        link.style.pointerEvents = 'auto';
      }
    }

    function _showForm(errorText) {
      const form = document.getElementById('signupForm');
      const sw   = document.querySelector('.switch');
      document.getElementById('loadingScreen').style.display = 'none';
      form.style.display = 'flex';
      form.style.opacity = '1';
      form.style.pointerEvents = 'auto';
      sw.style.display = 'block';
      sw.style.opacity = '1';
      document.getElementById('mainTitle').textContent = 'Create Account';
      document.getElementById('mainSub').textContent = 'Join and start your first trip today';
      if (errorText) {
        const msg = document.getElementById('msg');
        msg.className = 'msg error';
        msg.textContent = errorText;
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      if (document.getElementById('hp_signup').value) return;

      const msg    = document.getElementById('msg');
      const name   = document.getElementById('name').value.trim();
      const email  = document.getElementById('email').value.trim();
      const pw     = document.getElementById('password').value;
      const conf   = document.getElementById('confirm').value;

      msg.className = 'msg';
      if (pw !== conf)       { msg.className='msg error'; msg.textContent='Passwords do not match.'; return; }
      if (!selectedGender)   { msg.className='msg error'; msg.textContent='Please select your gender.'; return; }

      /* Fade out form while API call runs in parallel — no layout jump */
      const form = document.getElementById('signupForm');
      const sw   = document.querySelector('.switch');
      const card = document.querySelector('.card');

      /* Lock card height NOW (form still in layout) so hiding it won't collapse the card */
      card.style.minHeight = card.offsetHeight + 'px';

      form.style.opacity = '0';
      form.style.pointerEvents = 'none';
      sw.style.opacity = '0';
      document.getElementById('mainTitle').textContent = 'Creating account…';
      document.getElementById('mainSub').textContent = 'Just a moment';

      /* Keep password in memory for cross-device confirmation polling */
      _signedUpPw = pw;

      /* Start API call immediately, don't wait for fade */
      const apiPromise = Auth.register(name, email, pw, selectedGender);

      /* After CSS fade (150ms), swap to loading dots */
      await new Promise(r => setTimeout(r, 150));
      form.style.display = 'none';
      sw.style.display = 'none';
      document.getElementById('loadingScreen').style.display = 'block';

      const result = await apiPromise;
      card.style.minHeight = '';

      if (result.success) {
        _signedUpEmail = email;
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainTitle').textContent = 'Check your email';
        document.getElementById('mainSub').textContent = 'One last step to get started';
        document.getElementById('confirmedEmail').textContent = email;
        document.getElementById('successScreen').style.display = 'block';
        setTimeout(() => { document.getElementById('resendWrap').style.display = 'block'; }, 15000);
        _startConfirmationPoll(); /* cross-device: detect confirmation on phone/other browser */
      } else {
        const errText = (typeof result.error === 'string' && result.error && result.error !== '{}')
          ? result.error : 'Sign up failed. Please try again.';
        _showForm(errText);
      }
    }
  </script>
  <script>
    /* Fade the page in only after the background image has loaded */
    (function() {
      const img = new Image();
      const show = () => { document.body.style.opacity = '1'; };
      img.onload  = show;
      img.onerror = show; /* show immediately if image fails */
      img.src = 'img/world-map-bg.png';
      /* Fallback: show after 1.5 s no matter what */
      setTimeout(show, 1500);
    })();
  </script>
</body>
</html>
