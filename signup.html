  <script>
    /* App-only: pinch/double-tap zoom reads as a bug in a native app
       (nothing here is meant to be zoomable), but disabling it on the
       public website would hurt pinch-zoom accessibility for browser
       visitors - so this only overrides the viewport inside Capacitor. */
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
    }
  </script>
  <style>
    /* App-only: covers the moment this page resumes from background
       (e.g. tapping the emailed confirmation link while the app was
       still running on this "Check your email" screen) - there's a
       real gap between the app becoming visible again and deep-link.js's
       appUrlOpen listener actually firing and navigating away, during
       which this screen's stale "check your email" content would
       otherwise be visible. Toggled by the visibilitychange handler
       further down, not shown by default. */
    .pm-auth-loading { display: none; position: fixed; inset: 0; z-index: 99999; background: linear-gradient(160deg,#0d3347,#082233); align-items: center; justify-content: center; }
    .pm-auth-loading.pm-show { display: flex; }
    .pm-auth-loading img { width: 44px; height: 44px; border-radius: 12px; animation: pmAuthPulse 1.1s ease-in-out infinite; }
    @keyframes pmAuthPulse { 0%,100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { .pm-auth-loading img { animation: none; } }
  </style>

  <meta property="og:description" content="Create a free Packmates AI account and start building smart packing lists for your next trip.">

  <style>

    :root {
      --green: #5f9d30;
      --green-dark: #4d8225;
      --navy: #0d1b2a;
    }

    body {
      min-height:100vh;
      font-family:'Montserrat', sans-serif;
      background-color:#2ab5b5;
      background-image:url('img/world-map-bg.png');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      overflow-y:auto;
      position:relative;
      opacity:0;
      transition:opacity 0.55s ease;
    }

    body::before {
      content:'';
      position:fixed; inset:0;
      background:rgba(0,0,0,0.28);
      pointer-events:none;
      z-index:0;
    }

    body::after {
      content:'';
      position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events:none;
      z-index:0;
    }

    .card {
      position:relative; z-index:1;
      width:100%;
      max-width:440px;
      background:rgba(4,30,30,0.62);
      border:1px solid rgba(255,255,255,0.13);
      border-radius:24px;
      padding:40px 40px 36px;
      backdrop-filter:blur(28px);
      -webkit-backdrop-filter:blur(28px);
      box-shadow:0 32px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .logo {
      display:flex; align-items:center; justify-content:center;
      gap:10px; margin-bottom:28px;
    }
    .logo-name {
      font-family:'Blauer Nue', sans-serif; font-weight:700;
      font-size:1rem; letter-spacing:0.15em; text-transform:uppercase; color:#fff;
    }

    h1 {
      font-family:'Blauer Nue', sans-serif; font-size:1.75rem;
      font-weight:700; letter-spacing:-0.025em; color:#fff;
      text-align:center; margin-bottom:4px;
    }
    .sub {
      text-align:center; font-size:0.78rem;
      color:rgba(255,255,255,0.38); font-weight:500; margin-bottom:24px;
    }

    .msg {
      border-radius:10px; padding:10px 14px; margin-bottom:14px;
      font-size:0.78rem; text-align:left; display:none;
    }

    .field { position:relative; margin-bottom:14px; }

    .field input {
      width:100%;
      padding:13px 16px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px;

      font-size:0.9rem;

      transition:border-color 0.2s, background 0.2s, box-shadow 0.2s;

    /* Strength bars */

  <script src="auth.js"></script>
  <script src="lib/auth-flow.js"></script>
  <script>
    if (Auth.isLoggedIn()) location.replace('index.html');

    function togglePassword(id, btn) {
      const el = document.getElementById(id);
      const show = el.type === 'text';
      el.type = show ? 'password' : 'text';
      btn.textContent = show ? 'Show' : 'Hide';
    }

    function checkStrength(val) {
      const bars   = [1,2,3,4].map(i => document.getElementById('b'+i));
      const hint   = document.getElementById('shint');
      const colors = ['#e74c3c','#e67e22','#f1c40f','#5f9d30'];
      const labels = ['Weak','Fair','Good','Strong'];
      let score = 0;
      if (val.length >= 8)            score++;
      if (/[A-Z]/.test(val))          score++;
      if (/[0-9]/.test(val))          score++;
      if (/[^A-Za-z0-9]/.test(val))   score++;
      bars.forEach((b,i) => { b.style.background = i < score ? colors[score-1] : 'rgba(255,255,255,0.1)'; });
      hint.textContent = val.length ? (labels[score-1] || '') : '';
      hint.style.color = val.length ? colors[score-1] : '';
    }

    let selectedGender = null;

    function selectGender(btn) {
      document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedGender = btn.dataset.gender;
    }

    let _signedUpEmail = '';
    let _signedUpPw    = ''; /* kept in memory only — never stored */
    let _pollTimer     = null;

    /* Session exists by the time this is ever called, so index.html's
       own auth guard will pass - reveal a freshly-loaded copy instead
       of a hard reload. window.top (not window): this page can itself be
       running inside welcome.html's own auth-flow iframe, where
       auth-flow.js's own window.self!==window.top guard leaves it inert
       on THIS window - window.top is where the real, active instance
       always lives. */
    function _goHome() {
      if (window.top.PmAuthFlow) window.top.PmAuthFlow.reveal('index.html');
      else location.replace('index.html');
    }

    /* ── Same-browser detection: fires immediately when session is established ── */
    (async function() {
      const sb = await window._pm_sbLoaded;
      if (!sb) return;
      const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
        if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
          subscription.unsubscribe();
          if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
          _goHome();
        }
      });
    })();

    /* ── Cross-device detection: poll signIn every 5 s until email is confirmed ── */
    async function _startConfirmationPoll() {
      const sb = await window._pm_sbLoaded;
      if (!sb || !_signedUpEmail || !_signedUpPw) return;
      const email = _signedUpEmail, pw = _signedUpPw;
      async function checkNow() {
        if (!_signedUpPw) return; // already confirmed/stopped
        const { data } = await sb.auth.signInWithPassword({ email, password: pw });
        if (data?.session) {
          if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
          _signedUpPw = '';
          _goHome();
        }
      }
      _pollTimer = setInterval(checkNow, 5000);
      /* App-only: if the app was backgrounded on this screen (user
         switched to Mail, confirmed on another device, or tapped the
         confirmation link itself) and then resumed, two things can make
         this "check your email" screen visibly linger even though
         confirmation already happened:
         1. setInterval's paused timer picks up wherever it left off -
            the next check could be up to 5s away.
         2. If the resume was caused by tapping the link, deep-link.js's
            appUrlOpen listener is what actually navigates away (to
            welcome.html?code=...) - not this poll at all - but there's
            a real gap between the app becoming visible again and that
            listener firing, during which this screen's stale content
            would otherwise be visible.
         Cover that gap with the loading overlay immediately on resume,
         check right away instead of waiting for the timer, and reveal
         this screen again if nothing resolved it within a couple
         seconds (a plain resume with no pending confirmation). */
      const loadingEl = document.getElementById('pmAuthLoading');
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && loadingEl) {
          loadingEl.classList.add('pm-show');
          setTimeout(() => loadingEl.classList.remove('pm-show'), 2500);
        }
        checkNow();
      });
      /* Stop polling after 20 minutes and wipe password from memory */
      setTimeout(() => {
        if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
        _signedUpPw = '';
      }, 20 * 60 * 1000);
    }

    function openEmailApp() {
      window.location.href = 'mailto:';
    }

    async function resendEmail(e) {
      e.preventDefault();
      const link = document.getElementById('resendLink');
      link.textContent = 'Sending…';
      link.style.pointerEvents = 'none';
      const result = await Auth.resendConfirmation(_signedUpEmail);
      if (result.success) {
        link.textContent = 'Sent! Check your inbox.';
        link.style.color = '#7dcc40';
      } else {
        link.textContent = 'Failed — tap to try again';
        link.style.pointerEvents = 'auto';
      }
    }

    function _showForm(errorText) {
      const form = document.getElementById('signupForm');
      const sw   = document.querySelector('.switch');
      document.getElementById('loadingScreen').style.display = 'none';
      form.style.display = 'flex';
      form.style.opacity = '1';
      form.style.pointerEvents = 'auto';
      sw.style.display = 'block';
      sw.style.opacity = '1';
      document.getElementById('mainTitle').textContent = 'Create Account';
      document.getElementById('mainSub').textContent = 'Join and start your first trip today';
      if (errorText) {
        const msg = document.getElementById('msg');
        msg.className = 'msg error';
        msg.textContent = errorText;
      }
    }

    async function handleGoogle(e) {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      const result = await Auth.loginWithGoogle();
      if (!result.success) { msg.className = 'msg error'; msg.textContent = result.error; }
    }

    async function handleApple(e) {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      const result = await Auth.loginWithApple();
      if (!result.success) { msg.className = 'msg error'; msg.textContent = result.error; }
    }

    async function handleSignup(e) {
      e.preventDefault();
      if (document.getElementById('hp_signup').value) return;

      const msg    = document.getElementById('msg');
      const name   = document.getElementById('name').value.trim();
      const email  = document.getElementById('email').value.trim();
      const pw     = document.getElementById('password').value;
      const conf   = document.getElementById('confirm').value;

      msg.className = 'msg';
      if (pw !== conf)       { msg.className='msg error'; msg.textContent='Passwords do not match.'; return; }
      if (!selectedGender)   { msg.className='msg error'; msg.textContent='Please select your gender.'; return; }

      /* Fade out form while API call runs in parallel — no layout jump */
      const form = document.getElementById('signupForm');
      const sw   = document.querySelector('.switch');
      const card = document.querySelector('.card');

      /* Lock card height NOW (form still in layout) so hiding it won't collapse the card */
      card.style.minHeight = card.offsetHeight + 'px';

      form.style.opacity = '0';
      form.style.pointerEvents = 'none';
      sw.style.opacity = '0';
      document.getElementById('mainTitle').textContent = 'Creating account…';
      document.getElementById('mainSub').textContent = 'Just a moment';

      /* Keep password in memory for cross-device confirmation polling */
      _signedUpPw = pw;

      /* Start API call immediately, don't wait for fade */
      const apiPromise = Auth.register(name, email, pw, selectedGender);

      /* After CSS fade (150ms), swap to loading dots */
      await new Promise(r => setTimeout(r, 150));
      form.style.display = 'none';
      sw.style.display = 'none';
      document.getElementById('loadingScreen').style.display = 'block';

      const result = await apiPromise;
      card.style.minHeight = '';

      if (result.success && result.session) {
        /* Non-blocking mode (Supabase's "Confirm email" requirement is
           off for this project): a real session came back immediately,
           so there's nothing to wait on - go straight into the app
           instead of a blocking "check your email" screen. Confirming
           later is still possible and still useful (see
           Auth.isEmailConfirmed()'s reminder banner), just never
           required to actually use the app. */
        fetch('/api/send-welcome-email', {
          method: 'POST',
          headers: { Authorization: `Bearer ${result.session.access_token}` },
        }).catch(() => {});
        _signedUpPw = '';
        _goHome();
      } else if (result.success) {
        _signedUpEmail = email;
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainTitle').textContent = 'Check your email';
        document.getElementById('mainSub').textContent = 'One last step to get started';
        document.getElementById('confirmedEmail').textContent = email;
        document.getElementById('successScreen').style.display = 'block';
        setTimeout(() => { document.getElementById('resendWrap').style.display = 'block'; }, 15000);
        _startConfirmationPoll(); /* cross-device: detect confirmation on phone/other browser */
      } else {
        const errText = (typeof result.error === 'string' && result.error && result.error !== '{}')
          ? result.error : 'Sign up failed. Please try again.';
        _showForm(errText);
      }
    }
  </script>
  <script>
    /* Fade the page in only after the background image has loaded */
    (function() {
      const img = new Image();
      const show = () => { document.body.style.opacity = '1'; };
      img.onload  = show;
      img.onerror = show; /* show immediately if image fails */
      img.src = 'img/world-map-bg.png';
      /* Fallback: show after 1.5 s no matter what */
      setTimeout(show, 1500);
    })();
  </script>
</body>
</html>
