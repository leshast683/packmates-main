<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->

  <title>Packmates AI — Discover</title>
  <meta name="description" content="Discover trending destinations and travel inspiration with Packmates AI.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Packmates AI — Discover">
  <meta property="og:description" content="Discover trending destinations and travel inspiration with Packmates AI.">
  <meta property="og:image" content="https://packmatesai.com/img/discover-hero.jpg">
  <meta property="og:url" content="https://packmatesai.com/discover.html">
  <link rel="icon" type="image/png" href="img/appIcon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d3347">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body > main { padding:0 !important; overflow-x:hidden; }

    /* ── HERO ── */
    .discover-hero {
      position:relative;
      width:100%;
      height:320px;
      min-height:320px;
      flex-shrink:0;
      overflow:hidden;
      margin-bottom:28px;
    }
    .discover-hero-bg {
      position:absolute; inset:0;
      background: url('img/discover-hero.jpg') center 42% / cover no-repeat;
    }
    .discover-hero-overlay { display:none; }


    /* ── Page body ── */
    .discover-body { padding:0 28px 60px; }

    /* ── Section heads ── */
    .discover-section { margin-bottom:36px; animation:fadeUp .4s ease both; }
    .discover-section:nth-child(1) { animation-delay:.05s; }
    .discover-section:nth-child(2) { animation-delay:.1s; }
    .discover-section:nth-child(3) { animation-delay:.15s; }
    .section-head-new {
      display:flex; align-items:center; gap:10px;
      margin-bottom:16px;
    }
    .section-head-new h2 {
      font-size:1.05rem; font-weight:800;
      color:var(--text-1); letter-spacing:-.01em; margin:0;
    }
    .section-head-icon {
      width:26px; height:26px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
    }
    .section-head-icon svg { width:14px; height:14px; }

    /* ── Destination strip ── */
    .dest-strip {
      display:flex; gap:12px; overflow-x:auto;
      padding:4px 2px 14px; scrollbar-width:none;
    }
    .dest-strip::-webkit-scrollbar { display:none; }

    .dest-card {
      flex-shrink:0; width:170px; height:240px;
      border-radius:20px; cursor:pointer;
      position:relative; overflow:hidden;
      transition:transform .25s,box-shadow .25s;
      box-shadow:0 6px 20px rgba(0,0,0,.15);
    }
    .dest-card:hover { transform:translateY(-6px) scale(1.02); box-shadow:0 18px 44px rgba(0,0,0,.22); }
    .dest-card-bg {
      position:absolute; inset:0;
      background-size:cover; background-position:center;
      transition:transform .5s;
    }
    .dest-card:hover .dest-card-bg { transform:scale(1.07); }
    .dest-card-gradient {
      position:absolute; inset:0;
      background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.1) 55%, transparent 100%);
    }
    .dest-card-trips {
      position:absolute; top:10px; left:10px;
      background:rgba(255,255,255,.18);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.25);
      border-radius:20px; padding:3px 9px;
      color:#fff; font-size:.6rem; font-weight:700;
      letter-spacing:.05em; z-index:2;
    }
    .dest-card-heart {
      position:absolute; top:10px; right:10px;
      width:30px; height:30px; border-radius:50%;
      background:rgba(255,255,255,.18);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.25);
      display:flex; align-items:center; justify-content:center;
      z-index:2; cursor:pointer; transition:background .2s;
    }
    .dest-card-heart:hover { background:rgba(255,80,80,.7); }
    .dest-card-heart svg { width:13px; height:13px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .dest-card-info {
      position:absolute; bottom:0; left:0; right:0;
      padding:0 14px 14px; z-index:2;
      display:flex; align-items:flex-end; justify-content:space-between;
    }
    .dest-card-name {
      font-size:1rem; font-weight:800; color:#fff;
      line-height:1.2; letter-spacing:-.01em;
      text-shadow:0 1px 6px rgba(0,0,0,.5);
    }
    .dest-card-country {
      font-size:.6rem; color:rgba(255,255,255,.8);
      font-weight:600; letter-spacing:.06em;
      text-transform:uppercase; margin-top:2px;
      text-shadow:0 1px 4px rgba(0,0,0,.5);
    }
    .dest-card-arrow {
      width:30px; height:30px; border-radius:50%;
      background:rgba(255,255,255,.9);
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:transform .2s;
    }
    .dest-card-arrow svg { width:12px; height:12px; stroke:#1a2635; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .dest-card:hover .dest-card-arrow { transform:scale(1.1); }

    /* ── Community Travelers ── */
    .travelers-strip {
      display:flex; gap:12px; overflow-x:auto;
      padding:4px 2px 14px; scrollbar-width:none;
    }
    .travelers-strip::-webkit-scrollbar { display:none; }

    .traveler-card {
      flex-shrink:0; width:160px;
      background:var(--surface);
      border-radius:18px; padding:18px 14px 14px;
      border:1.5px solid var(--border);
      text-align:center;
      transition:transform .22s,box-shadow .22s,border-color .22s;
      cursor:pointer;
      position:relative;
    }
    .traveler-real-badge {
      position:absolute; top:10px; right:10px;
      background:rgba(95,157,48,.12); color:var(--green,#5f9d30);
      font-size:.55rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
      padding:2px 7px; border-radius:99px;
    }
    .traveler-card:hover {
      transform:translateY(-4px);
      box-shadow:0 12px 30px rgba(0,0,0,.09);
      border-color:transparent;
    }
    .traveler-avatar {
      width:52px; height:52px; border-radius:50%;
      margin:0 auto 8px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; font-weight:800; color:#fff;
      font-family:'Blauer Nue',sans-serif;
    }
    .traveler-name {
      font-size:.82rem; font-weight:700; color:var(--text-1);
      margin-bottom:2px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis;
    }
    .traveler-city {
      font-size:.63rem; color:var(--text-3);
      font-weight:500; margin-bottom:10px;
    }
    .traveler-stats {
      display:flex; justify-content:center; gap:14px;
      padding:10px 0 10px;
      border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);
      margin-bottom:10px;
    }
    .traveler-stat span:first-child {
      display:block; font-size:.88rem; font-weight:700; color:var(--text-1);
    }
    .traveler-stat span:last-child {
      display:block; font-size:.55rem; font-weight:700;
      letter-spacing:.07em; text-transform:uppercase; color:var(--text-3);
    }
    .follow-btn {
      display:block; width:100%; padding:7px;
      background:var(--green-bg); color:var(--green);
      border:none; border-radius:8px;
      font-family:'Montserrat',sans-serif;
      font-size:.68rem; font-weight:700;
      cursor:pointer; transition:background .2s,color .2s;
    }
    .follow-btn:hover { background:var(--green); color:#fff; }

    /* ── Traveler Profile Modal ── */
    .tp-backdrop {
      position:fixed; inset:0; z-index:1000;
      background:rgba(10,18,30,.55); backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center;
      padding:20px;
      opacity:0; pointer-events:none; transition:opacity .25s;
    }

    /* ── Inspiration grid ── */
    .inspiration-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .inspo-card {
      border-radius:20px; overflow:hidden;
      background:var(--surface);
      border:1.5px solid var(--border);
      cursor:pointer;
      transition:transform .25s,box-shadow .25s,border-color .25s;
    }
    .inspo-card:hover {
      transform:translateY(-5px);
      box-shadow:0 18px 44px rgba(0,0,0,.13);
      border-color:transparent;
    }
    .inspo-card-img {
      height:170px; position:relative; overflow:hidden;
    }
    .inspo-card-img-bg {
      width:100%; height:100%;
      background-size:cover; background-position:center;
      transition:transform .5s;
    }
    .inspo-card:hover .inspo-card-img-bg { transform:scale(1.06); }
    .inspo-card-overlay {
      position:absolute; inset:0;
      background:linear-gradient(to top, rgba(0,0,0,.65) 0%, rgba(0,0,0,.1) 60%, transparent 100%);
    }
    .inspo-public-badge {
      position:absolute; top:10px; left:10px;
      background:rgba(124,198,62,.85); backdrop-filter:blur(6px);
      border-radius:20px; padding:3px 9px;
      font-size:.58rem; font-weight:700;
      letter-spacing:.06em; text-transform:uppercase;
      color:#fff; z-index:2;
    }
    .inspo-bookmark-btn {
      position:absolute; top:10px; right:10px;
      width:30px; height:30px; border-radius:8px;
      background:rgba(255,255,255,.18); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.25);
      display:flex; align-items:center; justify-content:center;
      z-index:2; cursor:pointer; transition:background .2s;
    }
    .inspo-bookmark-btn:hover { background:rgba(255,255,255,.35); }
    .inspo-bookmark-btn svg { width:13px; height:13px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .inspo-avatars {
      position:absolute; bottom:10px; left:12px;
      display:flex; align-items:center; z-index:2;
    }
    .inspo-av {
      width:22px; height:22px; border-radius:50%;
      border:2px solid #fff; margin-left:-6px;
      display:flex; align-items:center; justify-content:center;
      font-size:.52rem; font-weight:700; color:#fff;
    }
    .inspo-av:first-child { margin-left:0; }
    .inspo-av-more {
      background:rgba(0,0,0,.45); backdrop-filter:blur(4px);
      font-size:.5rem; color:#fff; font-weight:700;
      margin-left:-6px; white-space:nowrap;
      width:auto; padding:0 5px; border-radius:20px; height:22px;
      border:2px solid #fff;
    }
    .inspo-card-name {
      position:absolute; bottom:10px; right:12px; left:12px;
      text-align:right; z-index:2;
      font-family:'Blauer Nue',sans-serif;
      font-size:1rem; font-weight:800; color:#fff;
      text-shadow:0 1px 6px rgba(0,0,0,.5);
      line-height:1.2;
    }
    .inspo-card-body { padding:12px 14px 14px; }
    .inspo-card-dest {
      font-family:'Blauer Nue',sans-serif;
      font-size:.95rem; font-weight:700;
      color:var(--text-1); margin-bottom:3px;
    }
    .inspo-card-meta {
      font-size:.7rem; font-weight:500; color:var(--text-3);
    }
    .inspo-card-country { color:var(--green); font-weight:700; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @media (max-width:1024px) {
      .inspiration-grid { grid-template-columns:repeat(2,1fr); }
      .discover-hero { height:280px; }
    }
    @media (max-width:700px) {
      .discover-hero { height:180px; min-height:180px; }
      .discover-hero-overlay { display:none; }
      .discover-hero-bg { background-size:cover; background-position:center 42%; }
      .inspiration-grid { grid-template-columns:1fr; }
      .discover-body { padding:0 14px 60px; }
    }
    @media (max-width:480px) {
      .section-head-new { flex-wrap: wrap; gap: 8px; }
      .discover-body { padding: 0 12px 80px; }
      .dest-strip { gap: 10px; }
      .travelers-strip { gap: 10px; }
    }

    /* ── Trip Itinerary Modal ── */
    .ti-backdrop {
      position:fixed; inset:0; z-index:1001;
      background:rgba(10,18,30,.6); backdrop-filter:blur(8px);
      display:flex; align-items:center; justify-content:center;
      padding:20px;
      opacity:0; pointer-events:none; transition:opacity .25s;
    }
    .ti-backdrop.open { opacity:1; pointer-events:all; }
    .ti-modal {
      background:var(--surface);
      border-radius:24px;
      width:100%; max-width:520px;
      max-height:88vh; overflow-y:auto;
      box-shadow:0 24px 64px rgba(0,0,0,.28);
      transform:translateY(20px) scale(.97);
      transition:transform .28s cubic-bezier(.22,.97,.42,1.12);
      scrollbar-width:none;
    }
    .ti-modal::-webkit-scrollbar { display:none; }
    .ti-backdrop.open .ti-modal { transform:none; }
    @media (max-width:640px) {
      .ti-backdrop { padding:0; align-items:flex-end; }
      .ti-modal {
        max-width:100%; border-radius:24px 24px 0 0;
        max-height:92vh; transform:translateY(40px);
      }
      .ti-backdrop.open .ti-modal { transform:none; }
      .ti-header { border-radius:24px 24px 0 0; }
      .ti-body { padding:0 16px 24px; }
      .ti-tabs { gap:6px; }
      .ti-tab { font-size:.74rem; padding:7px 10px; }
      .ti-pack-chip { font-size:.72rem; padding:4px 8px; }
    }
    .ti-close-btn {
      position:absolute; top:12px; right:12px; z-index:2;
      width:34px; height:34px; border-radius:50%;
      background:rgba(0,0,0,0.45); backdrop-filter:blur(6px);
      border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .ti-close-btn svg { width:16px; height:16px; }
    .ti-header {
      position:relative; height:200px;
      border-radius:24px 24px 0 0; overflow:hidden; flex-shrink:0;
    }
    .ti-header-bg {
      position:absolute; inset:0;
      background-size:cover; background-position:center;
    }
    .ti-header-overlay {
      position:absolute; inset:0;
      background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.1) 55%, transparent 100%);
    }
    .ti-header-info {
      position:absolute; bottom:0; left:0; right:0;
      padding:0 20px 18px; z-index:1;
    }
    .ti-header-country {
      font-size:.65rem; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:rgba(255,255,255,.75); margin-bottom:4px;
    }
    .ti-header-title {
      font-family:'Blauer Nue',sans-serif;
      font-size:1.5rem; font-weight:800;
      color:#fff; line-height:1.1; margin-bottom:4px;
      text-shadow:0 2px 8px rgba(0,0,0,.4);
    }
    .ti-header-dates {
      font-size:.72rem; color:rgba(255,255,255,.8); font-weight:500;
    }
    .ti-body { padding:0 20px 24px; }
    .ti-stats-bar {
      display:flex; gap:0;
      background:var(--bg); border-radius:14px;
      overflow:hidden; margin:18px 0 16px;
    }
    .ti-stat { flex:1; padding:14px 8px; text-align:center; }
    .ti-stat + .ti-stat { border-left:1px solid var(--border); }
    .ti-stat-num { display:block; font-size:1.15rem; font-weight:800; color:#0c7a7a; margin-bottom:2px; }
    .ti-stat-lbl { display:block; font-size:.55rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); }
    .ti-tabs {
      display:flex; gap:6px; margin-bottom:18px;
      background:var(--bg); border-radius:12px; padding:4px;
    }
    .ti-tab {
      flex:1; padding:8px 4px; border:none; border-radius:9px;
      font-family:'Montserrat',sans-serif; font-size:.72rem; font-weight:700;
      color:var(--text-3); background:transparent; cursor:pointer;
      transition:background .18s, color .18s;
    }
    .ti-tab.active { background:#0c7a7a; color:#fff; }
    .ti-panel { display:none; }
    .ti-panel.active { display:block; }
    .ti-day-card {
      background:var(--bg); border-radius:14px;
      padding:14px 16px; margin-bottom:10px;
      border:1px solid var(--border);
    }
    .ti-day-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:10px; }
    .ti-day-emoji { font-size:1.3rem; line-height:1; flex-shrink:0; margin-top:1px; }
    .ti-day-label { font-size:.6rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#0c7a7a; margin-bottom:2px; }
    .ti-day-title { font-size:.9rem; font-weight:700; color:var(--text-1); }
    .ti-day-acts { margin:0; padding:0 0 0 16px; list-style:disc; }
    .ti-day-acts li { font-size:.75rem; color:var(--text-2); line-height:1.6; }
    .ti-day-acts li::marker { color:#0c7a7a; }
    .ti-pack-section { margin-bottom:16px; }
    .ti-pack-cat {
      font-size:.62rem; font-weight:700; letter-spacing:.09em;
      text-transform:uppercase; color:var(--text-3); margin-bottom:8px;
    }
    .ti-pack-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .ti-pack-chip {
      display:flex; align-items:center; gap:5px;
      padding:5px 10px 5px 7px; border-radius:20px;
      font-size:.72rem; font-weight:600;
      background:rgba(12,122,122,.08); border:1px solid rgba(12,122,122,.18);
      color:#0a5050;
    }
    .ti-pack-chip svg, .ti-pack-chip img { width:14px; height:14px; flex-shrink:0; }
    .ti-travelers-list { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
    .ti-traveler-row {
      display:flex; align-items:center; gap:12px;
      padding:10px 12px; background:var(--bg);
      border-radius:12px; border:1px solid var(--border);
    }
    .ti-trav-av {
      width:40px; height:40px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:.75rem; font-weight:800; color:#fff;
      font-family:'Blauer Nue',sans-serif;
    }
    .ti-trav-info { flex:1; min-width:0; }
    .ti-trav-name { font-size:.82rem; font-weight:700; color:var(--text-1); }
    .ti-trav-city { font-size:.65rem; color:var(--text-3); margin-top:1px; }
    .ti-trav-tag {
      font-size:.6rem; font-weight:700; padding:3px 9px; border-radius:20px;
      background:rgba(12,122,122,.1); color:#0a5050;
      border:1px solid rgba(12,122,122,.2); white-space:nowrap; flex-shrink:0;
    }
    .ti-trav-tag.organizer { background:rgba(95,157,48,.12); color:#3d6e1a; border-color:rgba(95,157,48,.3); }
    .ti-extra-note {
      text-align:center; font-size:.72rem; color:var(--text-3);
      padding:10px; border:1.5px dashed var(--border); border-radius:12px;
    }
    /* Before You Go briefing card */
    .ti-brief-card {
      margin:0 0 14px;
      background:linear-gradient(145deg,#0b1f32 0%,#112840 60%,#0a1a28 100%);
      border:1px solid rgba(79,172,254,.12);
      border-radius:18px; overflow:hidden;
      box-shadow:0 8px 28px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .ti-brief-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px 10px;
      border-bottom:1px solid rgba(255,255,255,.05);
    }
    .ti-brief-title {
      font-size:.6rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
      display:flex; align-items:center; gap:7px;
      background:linear-gradient(90deg,#7cc63e,#4facfe);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .ti-brief-dot {
      width:6px; height:6px; border-radius:50%; background:#7cc63e; flex-shrink:0;
      box-shadow:0 0 10px rgba(124,198,62,.9);
      -webkit-text-fill-color:initial;
      animation:tiDotPulse 2s ease-in-out infinite;
    }
    @keyframes tiDotPulse {
      0%,100%{ box-shadow:0 0 6px rgba(124,198,62,.6); }
      50%{ box-shadow:0 0 14px rgba(124,198,62,1); }
    }
    .ti-brief-badge {
      font-size:.53rem; font-weight:800; letter-spacing:.08em;
      padding:2px 8px; border-radius:20px;
      background:linear-gradient(135deg,#0c7a7a,#7cc63e);
      color:#fff; box-shadow:0 0 12px rgba(124,198,62,.3);
    }
    .ti-brief-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:10px 12px 12px;
    }
    .ti-brief-tile {
      border-radius:12px; padding:10px 11px; border:1px solid;
      display:flex; flex-direction:column; gap:4px;
    }
    .ti-brief-tile-visa     { background:rgba(79,172,254,.07); border-color:rgba(79,172,254,.2); }
    .ti-brief-tile-currency { background:rgba(247,151,30,.07);  border-color:rgba(247,151,30,.2); }
    .ti-brief-tile-weather  { background:rgba(124,198,62,.07);  border-color:rgba(124,198,62,.2); }
    .ti-brief-tile-safety   { background:rgba(255,107,107,.07); border-color:rgba(255,107,107,.2); }
    .ti-brief-tile-head { display:flex; align-items:center; gap:5px; margin-bottom:2px; }
    .ti-brief-tile-icon { font-size:.9rem; line-height:1; }

    /* "Packmate" here is a lightweight, cosmetic "Follow" — separate from

       never traveled with — this just lets browsing Community Travelers
       stay interactive without faking a travel connection. */
    function getFollowing() {
      try { return JSON.parse(localStorage.getItem('pm_following') || '[]'); } catch { return []; }
    }
    function getFollowingIds() { return new Set(getFollowing()); }
    function toggleFollow(avatar) {
      const set = getFollowingIds();
      const adding = !set.has(avatar);
      adding ? set.add(avatar) : set.delete(avatar);
      localStorage.setItem('pm_following', JSON.stringify([...set]));
      return adding;
    }
    function applyFollowBtn(btn, active) {
      btn.textContent = active ? 'Following ✓' : 'Follow';

    function renderTravelerCard(t, idx) {
      const c = document.createElement('div');

      c.innerHTML = `
        ${t.isReal ? '<div class="traveler-real-badge" title="Real Packmates member">Member</div>' : ''}
        <div class="traveler-avatar" style="background:${t.color}">${t.avatarImg ? `<img src="${t.avatarImg}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">` : t.avatar}</div>

        </div>
        <button class="follow-btn">${isFollowing ? 'Following ✓' : 'Follow'}</button>`;
      const cardBtn = c.querySelector('.follow-btn');
      if (isFollowing) { cardBtn.style.background = 'var(--green)'; cardBtn.style.color = '#fff'; }
      cardBtn.addEventListener('click', e => {
        e.stopPropagation();
        applyFollowBtn(cardBtn, toggleFollow(t.avatar));
      });
      c.addEventListener('click', () => openTravelerModal(idx));
      return c;

    };

    /* ── Trip Itinerary Modal ── */
    function openTripModal(idx) {
      const s = SHARED[idx];
      // header
      document.getElementById('tiCountry').textContent = s.country;
      document.getElementById('tiTitle').textContent = s.dest;
      document.getElementById('tiDates').textContent = s.dates;
      const bg = document.getElementById('tiHeaderBg');
      bg.style.backgroundImage = s.fallback;
      const cached = getDestCache('inspo_' + s.dest);
      if (cached) {
        bg.style.backgroundImage = `url('${cached}')`;
      } else {
        fetchDestPhoto(s.query).then(url => {
          if (!url) return;
          setDestCache('inspo_' + s.dest, url);
          if (document.getElementById('tiBackdrop').classList.contains('open')) {
            document.getElementById('tiHeaderBg').style.backgroundImage = `url('${url}')`;
          }
        });
      }

      // stats
      document.getElementById('tiStatDays').textContent = s.itinerary.length;
      document.getElementById('tiStatTravelers').textContent = s.extra + s.travelersList.length;
      const packingForCount = s.country !== 'USA'
        ? s.packing.map(p => p.cat === 'Essentials' && !p.items.some(i => /travel adapter|universal adapter/i.test(i)) ? { items: ['Travel Adapter', ...p.items] } : p)
        : s.packing;
      document.getElementById('tiStatItems').textContent = packingForCount.reduce((a,c) => a + c.items.length, 0);

      // itinerary
      document.getElementById('tiPanelItinerary').innerHTML = s.itinerary.map(d => `
        <div class="ti-day-card">
          <div class="ti-day-head">
            <span class="ti-day-emoji">${d.emoji}</span>
            <div>
              <div class="ti-day-label">${d.day}</div>
              <div class="ti-day-title">${d.title}</div>
            </div>
          </div>
          <ul class="ti-day-acts">
            ${d.acts.map(a => `<li>${a}</li>`).join('')}
          </ul>
        </div>`).join('');

      // packing — inject Travel Adapter into Essentials for non-USA trips
      const packing = s.packing.map(p => {
        if (p.cat === 'Essentials' && s.country !== 'USA') {
          const already = p.items.some(i => /travel adapter|universal adapter/i.test(i));
          return already ? p : { ...p, items: ['Travel Adapter', ...p.items] };
        }
        if (p.cat !== 'Essentials' && s.country !== 'USA') {
          return { ...p, items: p.items.filter(i => !/universal adapter/i.test(i)) };
        }
        return p;
      }).filter(p => p.items.length > 0);
      const weatherContainer = document.createElement('div');
      weatherContainer.id = 'tiWeatherPicks';
      document.getElementById('tiPanelPacking').innerHTML = packing.map(p => `
        <div class="ti-pack-section">
          <div class="ti-pack-cat">${p.cat}</div>
          <div class="ti-pack-chips">${p.items.map(item => `<span class="ti-pack-chip">${getItemIcon(item)}${item}</span>`).join('')}</div>
        </div>`).join('');
      document.getElementById('tiPanelPacking').prepend(weatherContainer);

      // travelers
      document.getElementById('tiPanelTravelers').innerHTML =
        `<div class="ti-travelers-list">${s.travelersList.map(t => `
          <div class="ti-traveler-row">
            <div class="ti-trav-av" style="background:${t.color}">${t.av}</div>
            <div class="ti-trav-info">
              <div class="ti-trav-name">${t.name}</div>
              <div class="ti-trav-city">${t.city}</div>
            </div>
            <span class="ti-trav-tag ${t.tag === 'Trip Organizer' ? 'organizer' : ''}">${t.tag}</span>
          </div>`).join('')}</div>
        <div class="ti-extra-note">+${s.extra} more travelers on this trip</div>`;

      // reset tabs
      document.querySelectorAll('.ti-tab').forEach((b,i) => b.classList.toggle('active', i===0));
      document.querySelectorAll('.ti-panel').forEach((p,i) => p.classList.toggle('active', i===0));

      document.getElementById('tiBackdrop').classList.add('open');
      document.getElementById('tripItinModal').scrollTop = 0;
      document.body.style.overflow = 'hidden';
    }
    function closeTripModal() {
      document.getElementById('tiBackdrop').classList.remove('open');
      document.body.style.overflow = '';
    }
    function switchTiTab(name, btn) {
      document.querySelectorAll('.ti-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.ti-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tiPanel' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
    }
    document.getElementById('tiBackdrop').addEventListener('click', e => {
      if (e.target === document.getElementById('tiBackdrop')) closeTripModal();
    });
  </script>
