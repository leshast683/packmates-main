<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packmates — Sign In</title>
  <meta name="description" content="Sign in to Packmates to manage your trips and packing lists.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Packmates — Sign In">
  <meta property="og:description" content="Sign in to Packmates to manage your trips and packing lists.">
  <meta property="og:image" content="https://packmatesai.com/img/discover-hero.jpg">
  <meta property="og:url" content="https://packmatesai.com/login.html">
  <link rel="icon" type="image/png" href="img/appIcon.png">
  <link rel="stylesheet" href="fonts.css">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }

    :root {
      --green: #5f9d30;
      --green-dark: #4d8225;
      --green2: #7cc63e;
      --navy: #0d3347;
    }

    body {
      min-height:100vh;
      font-family:'Montserrat', sans-serif;
      background: linear-gradient(135deg, #082233 0%, #0d3347 50%, #113a58 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      overflow:hidden;
      position:relative;
    }

    /* Animated orbs */
    .orb {
      position:fixed;
      border-radius:50%;
      filter:blur(80px);
      pointer-events:none;
    }
    .orb-1 {
      width:500px; height:500px;
      top:-150px; right:-100px;
      background:radial-gradient(circle, rgba(26,88,120,0.6), transparent 70%);
      animation:drift 20s ease-in-out infinite;
    }
    .orb-2 {
      width:400px; height:400px;
      bottom:-100px; left:-80px;
      background:radial-gradient(circle, rgba(95,157,48,0.1), transparent 70%);
      animation:drift 26s 3s ease-in-out infinite reverse;
    }
    @keyframes drift {
      0%,100% { transform:translate(0,0); }
      33%      { transform:translate(40px,60px); }
      66%      { transform:translate(-50px,30px); }
    }

    /* Grain */
    body::after {
      content:'';
      position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      pointer-events:none;
      z-index:0;
    }

    /* Card */
    .card {
      position:relative; z-index:1;
      width:100%;
      max-width:420px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:24px;
      padding:44px 40px 36px;
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      box-shadow:0 32px 80px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
      animation:slideUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(32px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    /* Logo */
    .logo {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin-bottom:32px;
    }
    .logo img {
      width:34px; height:34px;
      border-radius:9px;
      box-shadow:0 4px 16px rgba(0,0,0,0.4);
    }
    .logo-name {
      font-family:'Blauer Nue', sans-serif;
      font-weight:700;
      font-size:1rem;
      letter-spacing:0.15em;
      text-transform:uppercase;
      color:#fff;
    }

    /* Heading */
    h1 {
      font-family:'Blauer Nue', sans-serif;
      font-size:1.75rem;
      font-weight:700;
      letter-spacing:-0.025em;
      color:#fff;
      text-align:center;
      margin-bottom:4px;
    }
    .sub {
      text-align:center;
      font-size:0.78rem;
      color:rgba(255,255,255,0.38);
      font-weight:500;
      margin-bottom:28px;
    }

    /* Alert */
    .msg {
      border-radius:10px;
      padding:10px 14px;
      margin-bottom:14px;
      font-size:0.78rem;
      text-align:left;
      display:none;
    }
    .msg.error   { background:rgba(220,50,50,0.15); border:1px solid rgba(220,50,50,0.25); color:#ff8a8a; display:block; }
    .msg.success { background:rgba(95,157,48,0.15); border:1px solid rgba(95,157,48,0.25); color:#a0e060; display:block; }

    /* Form */
    .form { display:flex; flex-direction:column; }

    .field-label {
      font-size:0.68rem;
      font-weight:700;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:rgba(255,255,255,0.5);
      margin-bottom:7px;
      display:block;
    }

    .field {
      position:relative;
      margin-bottom:16px;
    }

    .field input {
      width:100%;
      padding:13px 16px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px;
      font-family:'Montserrat', sans-serif;
      font-size:0.9rem;
      color:#fff;
      outline:none;
      transition:border-color 0.2s, background 0.2s, box-shadow 0.2s;
      margin:0;
    }
    .field input::placeholder { color:rgba(255,255,255,0.25); }
    .field input:focus {
      border-color:var(--green);
      background:rgba(255,255,255,0.1);
      box-shadow:0 0 0 3px rgba(95,157,48,0.15);
    }

    .toggle-pw {
      position:absolute;
      right:14px; top:50%;
      transform:translateY(-50%);
      background:none; border:none;
      color:rgba(255,255,255,0.3);
      font-family:'Montserrat', sans-serif;
      font-size:0.72rem;
      font-weight:600;
      cursor:pointer;
      transition:color 0.2s;
    }
    .toggle-pw:hover { color:rgba(255,255,255,0.7); }

    /* Remember + Forgot */
    .row-extras {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }
    .remember {
      display:flex;
      align-items:center;
      gap:7px;
      font-size:0.78rem;
      color:rgba(255,255,255,0.5);
      cursor:pointer;
    }
    .remember input { width:auto; margin:0; accent-color:var(--green); cursor:pointer; }
    .forgot {
      font-size:0.78rem;
      color:var(--green);
      text-decoration:none;
      font-weight:600;
      transition:opacity 0.2s;
    }
    .forgot:hover { opacity:0.75; }

    /* Submit */
    .btn-submit {
      width:100%;
      padding:14px;
      background:var(--green);
      color:#fff;
      border:none;
      border-radius:12px;
      font-family:'Montserrat', sans-serif;
      font-size:0.82rem;
      font-weight:700;
      cursor:pointer;
      transition:all 0.22s;
      margin-bottom:20px;
      position:relative;
      overflow:hidden;
    }
    .btn-submit::before {
      content:'';
      position:absolute; inset:0;
      background:linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity:0;
      transition:opacity 0.2s;
    }
    .btn-submit:hover::before { opacity:1; }
    .btn-submit:hover { background:#52892a; transform:translateY(-1px); box-shadow:0 8px 20px rgba(95,157,48,0.35); }
    .btn-submit:active { transform:translateY(0); box-shadow:none; }

    /* Divider */
    .divider {
      display:flex;
      align-items:center;
      gap:12px;
      color:rgba(255,255,255,0.2);
      font-size:0.72rem;
      font-weight:500;
      margin-bottom:16px;
    }
    .divider::before, .divider::after {
      content:'';
      flex:1;
      height:1px;
      background:rgba(255,255,255,0.1);
    }

    /* Social */
    .socials { display:flex; gap:10px; margin-bottom:24px; }
    .social-btn {
      flex:1;
      padding:11px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px;
      color:#fff;
      font-family:'Montserrat', sans-serif;
      font-size:0.78rem;
      font-weight:600;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      transition:background 0.2s, border-color 0.2s;
    }
    .social-btn:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.2); }

    /* Switch */
    .switch {
      text-align:center;
      font-size:0.78rem;
      color:rgba(255,255,255,0.4);
    }
    .switch a { color:var(--green); text-decoration:none; font-weight:700; transition:opacity 0.2s; }
    .switch a:hover { opacity:0.8; }
    @media (max-width: 480px) {
      body { padding: 16px; align-items: flex-start; padding-top: 28px; overflow-y: auto; }
      .card { padding: 32px 24px 28px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="logo">
      <img src="img/appIcon.png" alt="Packmates">
      <span class="logo-name">Packmates</span>
    </div>

    <h1>Welcome Back</h1>
    <p class="sub">Sign in to continue your adventure</p>

    <div class="msg" id="msg"></div>

    <form class="form" onsubmit="handleLogin(event)">
      <label class="field-label" for="email">Email</label>
      <div class="field">
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <label class="field-label" for="password">Password</label>
      <div class="field">
        <input type="password" id="password" placeholder="Enter your password" required>
        <button type="button" class="toggle-pw" onclick="togglePassword()">Show</button>
      </div>

      <div class="row-extras">
        <label class="remember">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot" onclick="showReset(event)">Forgot password?</a>
      </div>

      <!-- honeypot: hidden from real users, bots fill it in -->
      <input type="text" id="hp_login" name="hp_email2" tabindex="-1" autocomplete="off" aria-hidden="true"
        style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <!-- Reset password panel (hidden by default) -->
    <form class="form" id="resetForm" style="display:none" onsubmit="handleReset(event)">
      <label class="field-label" for="resetEmail">Your Email</label>
      <div class="field">
        <input type="email" id="resetEmail" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn-submit">Send Reset Link</button>
      <div style="text-align:center;margin-top:-10px;margin-bottom:16px;">
        <a href="#" class="forgot" onclick="showLogin(event)">Back to sign in</a>
      </div>
    </form>

    <div class="divider" id="divider">or continue with</div>
    <div class="socials">
      <button class="social-btn" onclick="handleGoogle(event)">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#ea4335" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google
      </button>
      <button class="social-btn" disabled title="Coming soon" style="opacity:0.45;cursor:not-allowed;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#4267B2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Facebook
      </button>
    </div>

    <div class="switch">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>

  <script src="lib/sync-guard.js"></script>
  <script src="auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) location.replace('index.html');

    window.addEventListener('DOMContentLoaded', () => {
      const saved = Auth.getSavedEmail();
      if (saved) { document.getElementById('email').value = saved; document.getElementById('remember').checked = true; }

      const p = new URLSearchParams(location.search);
      const msg = document.getElementById('msg');
      if (p.get('expired') === '1') {
        msg.className = 'msg error';
        msg.textContent = 'Your session expired. Please sign in again.';
      } else if (p.get('reset_success') === '1') {
        msg.className = 'msg success';
        msg.textContent = 'Password updated! Sign in with your new password.';
      }
    });

    function togglePassword() {
      const pw = document.getElementById('password');
      const btn = document.querySelector('.toggle-pw');
      const show = pw.type === 'text';
      pw.type = show ? 'password' : 'text';
      btn.textContent = show ? 'Show' : 'Hide';
    }

    function showReset(e) {
      e.preventDefault();
      document.querySelector('.form').style.display = 'none';
      document.getElementById('resetForm').style.display = 'flex';
      document.getElementById('divider').style.display = 'none';
      document.querySelector('.socials').style.display = 'none';
      document.querySelector('h1').textContent = 'Reset Password';
      document.querySelector('.sub').textContent = 'Enter your email to receive a password reset link';
      document.getElementById('msg').className = 'msg';
    }

    function showLogin(e) {
      e.preventDefault();
      document.querySelector('.form').style.display = 'flex';
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('divider').style.display = 'flex';
      document.querySelector('.socials').style.display = 'flex';
      document.querySelector('h1').textContent = 'Welcome Back';
      document.querySelector('.sub').textContent = 'Sign in to continue your adventure';
      document.getElementById('msg').className = 'msg';
    }

    async function handleReset(e) {
      e.preventDefault();
      const msg   = document.getElementById('msg');
      const email = document.getElementById('resetEmail').value.trim();
      msg.className = 'msg';
      if (!email) { msg.className = 'msg error'; msg.textContent = 'Please enter your email.'; return; }
      const btn = document.querySelector('#resetForm .btn-submit');
      btn.disabled = true; btn.textContent = 'Sending…';
      const result = await Auth.sendPasswordReset(email);
      btn.disabled = false; btn.textContent = 'Send Reset Link';
      if (!result.success) { msg.className = 'msg error'; msg.textContent = result.error; return; }
      msg.className = 'msg success';
      msg.textContent = 'Check your email for a reset link.';
    }

    async function handleGoogle(e) {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      const result = await Auth.loginWithGoogle();
      if (!result.success) { msg.className = 'msg error'; msg.textContent = result.error; }
    }

    async function resendConfirmation(e, email) {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const link = e.target;
      link.textContent = 'Sending…';
      link.style.pointerEvents = 'none';
      const result = await Auth.resendConfirmation(email);
      if (result.success) {
        msg.className = 'msg success';
        msg.innerHTML = 'Confirmation email resent — check your inbox.';
      } else {
        msg.className = 'msg error';
        msg.innerHTML = `Failed to resend: ${result.error} <a href="#" onclick="resendConfirmation(event,'${email.replace(/'/g,"\\'")}')">Try again</a>`;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      if (document.getElementById('hp_login').value) return; // bot trap

      const msg = document.getElementById('msg');
      msg.className = 'msg';

      // client-side brute-force lockout (5 failures → 30s cooldown, doubles each time)
      const lockUntil = parseInt(sessionStorage.getItem('pm_lock_until') || '0', 10);
      if (Date.now() < lockUntil) {
        const secs = Math.ceil((lockUntil - Date.now()) / 1000);
        msg.className = 'msg error';
        msg.textContent = `Too many failed attempts. Try again in ${secs}s.`;
        return;
      }

      const email    = document.getElementById('email').value.trim();
      const pw       = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const result = await Auth.login(email, pw, remember);

      if (result.success) {
        sessionStorage.removeItem('pm_login_fails');
        sessionStorage.removeItem('pm_lock_until');
        msg.className = 'msg success'; msg.textContent = 'Signing in…';
        setTimeout(() => location.replace('index.html'), 700);
      } else if (result.error === 'EMAIL_NOT_CONFIRMED') {
        msg.className = 'msg error';
        msg.innerHTML = `Please confirm your email first. <a href="#" onclick="resendConfirmation(event,'${email.replace(/'/g,"\\'")}')">Resend email</a>`;
      } else {
        const fails = parseInt(sessionStorage.getItem('pm_login_fails') || '0', 10) + 1;
        if (fails >= 5) {
          const prev = parseInt(sessionStorage.getItem('pm_lock_dur') || '30', 10);
          const dur  = Math.min(prev * 2, 300); // caps at 5 min
          sessionStorage.setItem('pm_lock_until', Date.now() + dur * 1000);
          sessionStorage.setItem('pm_lock_dur',   dur);
          sessionStorage.setItem('pm_login_fails', '0');
          msg.className = 'msg error';
          msg.textContent = `Too many failed attempts. Please wait ${dur} seconds.`;
        } else {
          sessionStorage.setItem('pm_login_fails', fails);
          msg.className = 'msg error'; msg.textContent = result.error;
        }
      }
    }
  </script>
</body>
</html>
